<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Вантажник - довідник магазинів</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    body { 
      background: linear-gradient(135deg, #e2e9f0 0%, #cfdbe5 100%); 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      padding: 16px; 
      min-height: 100vh;
    }
    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      width: 100%;
    }
    
    /* ШАПКА */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    h1 { 
      font-size: 1.4rem; 
      color: #1a3a44; 
    }
    h1 small { 
      font-size: 0.6rem; 
      background: #2c7da0; 
      color: white; 
      padding: 4px 10px; 
      border-radius: 40px;
      margin-left: 8px;
    }
    .user-greeting { 
      background: #d4edda; 
      color: #155724; 
      padding: 6px 12px; 
      border-radius: 30px; 
      font-size: 0.7rem; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logout-btn {
      background: none;
      border: none;
      color: #dc3545;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    
    /* ПАНЕЛЬ ЗАВАНТАЖЕННЯ */
    .sync-panel {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      border: 2px solid #2c7da0;
    }
    .sync-title { 
      font-weight: bold; 
      font-size: 0.9rem; 
      margin-bottom: 12px; 
      color: #1a3a44; 
      text-align: center; 
    }
    .btn-full {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      border: none;
      cursor: pointer;
    }
    .btn-green { background: #28a745; color: white; }
    .btn-blue { background: #2c7da0; color: white; }
    .btn-red { background: #dc3545; color: white; }
    .btn-gray { background: #6c757d; color: white; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .sync-status {
      font-size: 0.75rem;
      padding: 10px;
      margin-top: 12px;
      border-radius: 40px;
      text-align: center;
      background: #eef3fa;
      color: #2c5a6e;
    }
    
    /* КАРТКИ КАТЕГОРІЙ */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .category-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      text-align: center;
    }
    .category-card:active { transform: scale(0.97); }
    .cat-header {
      padding: 10px 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .white-header { background: #e3e8ee; color: #1e3a4a; border-bottom: 3px solid #2c7da0; }
    .gray-header { background: #5a6e78; color: white; border-bottom: 3px solid #2c3e42; }
    .black-header { background: #1e2a2e; color: white; border-bottom: 3px solid #f39c12; }
    .cat-body { padding: 12px; }
    .cat-count { font-size: 1.8rem; font-weight: bold; color: #2c7da0; }
    .cat-label { font-size: 0.65rem; color: #6c757d; margin-top: 4px; }
    .empty-cat { opacity: 0.5; }
    
    /* КАРТКИ ДЛЯ ДІЙ */
    .action-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .action-card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #1a3a44;
      text-align: center;
    }
    
    /* ПОЛЯ ВВОДУ */
    .row-input {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .row-input input, .row-input select {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbdae2;
      border-radius: 40px;
      font-size: 1rem;
      text-align: center;
    }
    
    /* СПОСОБИ ДОСТАВКИ */
    .delivery-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 16px;
      max-height: 110px;
      overflow-y: auto;
    }
    .delivery-btn {
      background: #e9ecef;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .delivery-btn.selected {
      background: #2c7da0;
      color: white;
    }
    
    /* ДОДАВАННЯ НОВОГО СПОСОБУ */
    .add-delivery-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }
    .add-delivery-row input {
      width: 100%;
      padding: 12px;
      border-radius: 40px;
      border: 1px solid #ced4da;
    }
    .add-delivery-row button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      border-radius: 40px;
    }
    
    /* ТЕКСТОВЕ ПОЛЕ */
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 16px;
      font-size: 0.8rem;
      font-family: inherit;
      margin-top: 8px;
      resize: vertical;
    }
    
    /* РЕЗУЛЬТАТ ПЕРЕВІРКИ */
    .check-result {
      margin-top: 12px;
      padding: 12px;
      background: #eef3fa;
      border-radius: 16px;
      font-size: 0.85rem;
    }
    
    .error-message {
      background: #ffe0e0;
      color: #b91c1c;
      padding: 10px;
      border-radius: 40px;
      font-size: 0.75rem;
      text-align: center;
      margin-top: 8px;
    }
    
    .data-placeholder {
      text-align: center;
      padding: 40px;
      background: #f8f9fa;
      border-radius: 20px;
      color: #6c757d;
    }
    
    footer {
      text-align: center;
      font-size: 0.6rem;
      color: #6c757d;
      padding: 16px;
    }
    
    /* МОДАЛЬНЕ ВІКНО */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 28px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #e9ecef;
    }
    .modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .modal-shop-item {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .modal-shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .modal-shop-num {
      font-weight: bold;
      font-size: 1rem;
      background: #2c7da0;
      color: white;
      padding: 4px 12px;
      border-radius: 30px;
    }
    .modal-shop-delivery {
      font-size: 0.7rem;
      color: #2c7da0;
      background: #e8f4f8;
      padding: 4px 10px;
      border-radius: 30px;
      margin: 6px 0;
      display: inline-block;
    }
    .modal-shop-description {
      font-size: 0.7rem;
      color: #555;
      background: #f0f0f0;
      padding: 8px;
      border-radius: 12px;
      margin-top: 8px;
    }
    .delete-shop-modal, .edit-shop-modal {
      border: none;
      padding: 5px 10px;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .delete-shop-modal { background: #ffe0e0; color: #b91c1c; }
    .edit-shop-modal { background: #e3f2fd; color: #2c7da0; }
    .modal-close {
      margin: 12px 20px 20px;
      padding: 12px;
      background: #6c757d;
      border-radius: 40px;
    }
    
    /* ЛОГІН */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #1a3a44 0%, #2c7da0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .login-card {
      background: white;
      border-radius: 40px;
      padding: 32px 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }
    .login-card h2 { margin-bottom: 8px; color: #1a3a44; }
    .login-card input {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbdae2;
      border-radius: 40px;
      font-size: 1rem;
      margin: 12px 0;
      text-align: center;
    }
    .login-card button {
      width: 100%;
      padding: 14px;
      background: #2c7da0;
      font-size: 1rem;
      border-radius: 40px;
      border: none;
      color: white;
      font-weight: bold;
    }
    .switch-mode {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #2c7da0;
      cursor: pointer;
    }
    .error-msg { color: #dc3545; font-size: 0.7rem; margin-top: 8px; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  // ============================================================
  // ВАШІ ДАНІ З SUPABASE
  const SUPABASE_URL = "https://iairlqllcbjemvlqqonl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_g2FK03ci-RrYFJk_DdqOsA_CQC3lg4X";
  // ============================================================
  
  const BASE_PASSWORD = "123";
  
  let currentUser = null;
  let shopsData = [];
  let deliveryMethodsList = [];
  let selectedDelivery = "";
  let currentDescription = "";
  
  const colorNames = { "білі": "⚪ БІЛІ", "сірі": "⚫ СІРІ", "чорні": "⬛ ЧОРНІ" };
  const complexityNames = {
    "легко": { title: "Стандарт", icon: "🟢" },
    "потно": { title: "Ускладнений", icon: "🟡" },
    "тяжко": { title: "Складний", icon: "🔴" }
  };
  
  // ========== ПЕРЕВІРКА НА ДУБЛІКАТ ==========
  function isShopExists(number) {
    return shopsData.some(shop => shop.number === number);
  }
  
  // ========== РОБОТА З SUPABASE ==========
  async function fetchShops() {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/shops?select=*`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if (!response.ok) throw new Error('Помилка завантаження');
    return await response.json();
  }
  
  async function addShopToDB(number, color, difficulty, delivery_method, description) {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/shops`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ number, color, difficulty, delivery_method, description: description || null })
    });
    if (!response.ok) throw new Error('Помилка додавання');
    return true;
  }
  
  async function deleteShopFromDB(id) {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/shops?id=eq.${id}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    if (!response.ok) throw new Error('Помилка видалення');
  }
  
  async function updateShopInDB(id, updates) {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/shops?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(updates)
    });
    if (!response.ok) throw new Error('Помилка оновлення');
  }
  
  // ========== ОБРОБКА ДАНИХ ==========
  function getShopsByColorAndDifficulty() {
    const result = {
      "білі": { "легко": [], "потно": [], "тяжко": [] },
      "сірі": { "легко": [], "потно": [], "тяжко": [] },
      "чорні": { "легко": [], "потно": [], "тяжко": [] }
    };
    shopsData.forEach(shop => {
      if (result[shop.color] && result[shop.color][shop.difficulty]) {
        result[shop.color][shop.difficulty].push(shop);
      }
    });
    for (let color in result) {
      for (let diff in result[color]) {
        result[color][diff].sort((a,b) => a.number - b.number);
      }
    }
    return result;
  }
  
  function getDeliveryMethods() {
    const methods = new Set();
    methods.add("🏪 Завоз в магазин");
    methods.add("✋ Ручне занесення");
    methods.add("🏢 2й поверх → руками");
    methods.add("⬇️ Підвал");
    
    shopsData.forEach(shop => {
      if (shop.delivery_method && shop.delivery_method.trim()) {
        methods.add(shop.delivery_method);
      }
    });
    return Array.from(methods).map(m => ({ key: m, title: m }));
  }
  
  // ========== ІНТЕРФЕЙС ==========
  async function loadData() {
    const statusDiv = document.getElementById("syncStatus");
    statusDiv.innerHTML = "📥 Завантаження...";
    try {
      shopsData = await fetchShops();
      deliveryMethodsList = getDeliveryMethods();
      renderCategories();
      initDeliveryButtons();
      statusDiv.innerHTML = `✅ Завантажено ${shopsData.length} магазинів`;
    } catch(e) {
      statusDiv.innerHTML = "❌ Помилка: " + e.message;
      console.error(e);
    }
  }
  
  async function addNewShop() {
    // Прибрати помилку, якщо була
    const errorDiv = document.getElementById("addError");
    if (errorDiv) errorDiv.style.display = "none";
    
    const num = document.getElementById("newShopNumber").value.trim();
    if (!num) { 
      showError("Введіть номер магазину");
      return; 
    }
    const number = parseInt(num);
    if (isNaN(number)) { 
      showError("Номер має бути числом");
      return; 
    }
    
    // ПЕРЕВІРКА НА ДУБЛІКАТ
    if (isShopExists(number)) {
      showError(`❌ Магазин ${number} вже існує в базі даних!`);
      return;
    }
    
    const color = document.getElementById("newShopColor").value;
    const difficulty = document.getElementById("newShopComplexity").value;
    const delivery_method = selectedDelivery;
    const description = currentDescription;
    
    const statusDiv = document.getElementById("syncStatus");
    statusDiv.innerHTML = "💾 Збереження...";
    
    try {
      await addShopToDB(number, color, difficulty, delivery_method, description);
      await loadData();
      document.getElementById("newShopNumber").value = "";
      document.getElementById("shopDescriptionInput").value = "";
      currentDescription = "";
      selectedDelivery = "";
      document.querySelectorAll('.delivery-btn').forEach(b => b.classList.remove('selected'));
      statusDiv.innerHTML = "✅ Магазин додано!";
    } catch(e) {
      showError("Помилка: " + e.message);
      statusDiv.innerHTML = "❌ Помилка: " + e.message;
    }
  }
  
  function showError(message) {
    let errorDiv = document.getElementById("addError");
    if (!errorDiv) {
      const addBtn = document.getElementById("addShopBtn");
      errorDiv = document.createElement("div");
      errorDiv.id = "addError";
      errorDiv.className = "error-message";
      addBtn.parentNode.insertBefore(errorDiv, addBtn);
    }
    errorDiv.style.display = "block";
    errorDiv.innerHTML = message;
    setTimeout(() => {
      if (errorDiv) errorDiv.style.display = "none";
    }, 3000);
  }
  
  function renderCategories() {
    const container = document.getElementById("categoriesGrid");
    if (!container) return;
    const organized = getShopsByColorAndDifficulty();
    const colors = ["білі", "сірі", "чорні"];
    const comps = ["легко", "потно", "тяжко"];
    const headerClass = { "білі": "white-header", "сірі": "gray-header", "чорні": "black-header" };
    
    let html = '';
    for (let color of colors) {
      for (let comp of comps) {
        const shopsList = organized[color][comp];
        const count = shopsList.length;
        html += `<div class="category-card" data-color="${color}" data-comp="${comp}">
          <div class="cat-header ${headerClass[color]}">${colorNames[color]}</div>
          <div class="cat-body ${count === 0 ? 'empty-cat' : ''}">
            <div class="cat-count">${count}</div>
            <div class="cat-label">${complexityNames[comp].icon} ${complexityNames[comp].title}</div>
          </div>
        </div>`;
      }
    }
    container.innerHTML = html;
    
    document.querySelectorAll('.category-card').forEach(card => {
      card.onclick = () => openShopList(card.dataset.color, card.dataset.comp);
    });
  }
  
  function openShopList(color, difficulty) {
    const organized = getShopsByColorAndDifficulty();
    const shopsList = organized[color][difficulty];
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    
    let listHtml = '';
    if (shopsList.length === 0) {
      listHtml = '<div style="text-align:center; padding:40px;">✖️ Немає магазинів</div>';
    } else {
      listHtml = shopsList.map(shop => `
        <div class="modal-shop-item">
          <div class="modal-shop-header">
            <span class="modal-shop-num">${shop.number}</span>
            <div style="display:flex; gap:8px;">
              <button class="edit-shop-modal" data-id="${shop.id}">✏️</button>
              <button class="delete-shop-modal" data-id="${shop.id}" data-number="${shop.number}">✖</button>
            </div>
          </div>
          ${shop.delivery_method ? `<div class="modal-shop-delivery">🚚 ${shop.delivery_method}</div>` : ''}
          ${shop.description ? `<div class="modal-shop-description">📝 ${shop.description}</div>` : ''}
        </div>
      `).join('');
    }
    
    overlay.innerHTML = `<div class="modal-content">
      <div class="modal-header" style="background:#2c7da0; color:white;">${colorNames[color]} · ${complexityNames[difficulty].icon} ${complexityNames[difficulty].title}</div>
      <div class="modal-list">${listHtml}</div>
      <button class="modal-close" id="closeModalBtn">Закрити</button>
    </div>`;
    document.body.appendChild(overlay);
    
    overlay.querySelectorAll('.delete-shop-modal').forEach(btn => {
      btn.onclick = async () => {
        const id = parseInt(btn.dataset.id);
        const number = btn.dataset.number;
        if (confirm(`Видалити магазин ${number}?`)) {
          await deleteShopFromDB(id);
          await loadData();
          overlay.remove();
        }
      };
    });
    overlay.querySelectorAll('.edit-shop-modal').forEach(btn => {
      btn.onclick = async () => {
        const id = parseInt(btn.dataset.id);
        const shop = shopsData.find(s => s.id === id);
        const newDesc = prompt("Новий опис магазину:", shop.description || "");
        if (newDesc !== null) {
          await updateShopInDB(id, { description: newDesc || null });
          await loadData();
          overlay.remove();
          openShopList(color, difficulty);
        }
      };
    });
    overlay.querySelector('#closeModalBtn').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  }
  
  function checkShop() {
    const num = document.getElementById("checkShopInput").value.trim();
    if (!num) { document.getElementById("checkResult").innerHTML = "⚠️ Введіть номер"; return; }
    const number = parseInt(num);
    const shop = shopsData.find(s => s.number === number);
    if (shop) {
      document.getElementById("checkResult").innerHTML = `
        <strong>🏪 Магазин ${shop.number}</strong><br>
        📌 ${colorNames[shop.color]}, ${complexityNames[shop.difficulty].icon} ${complexityNames[shop.difficulty].title}
        ${shop.delivery_method ? `<br>🚚 ${shop.delivery_method}` : ''}
        ${shop.description ? `<br>📝 ${shop.description}` : ''}
      `;
    } else {
      document.getElementById("checkResult").innerHTML = `<strong>🏪 Магазин ${number}</strong><br>⚠️ Немає даних`;
    }
  }
  
  function initDeliveryButtons() {
    const container = document.getElementById("deliveryButtons");
    if (!container) return;
    container.innerHTML = "";
    deliveryMethodsList.forEach(m => {
      const btn = document.createElement("div");
      btn.className = "delivery-btn";
      btn.textContent = m.title;
      btn.onclick = () => {
        document.querySelectorAll('.delivery-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedDelivery = m.title;
      };
      container.appendChild(btn);
    });
  }
  
  function addCustomDelivery() {
    const input = document.getElementById("newDeliveryInput");
    const newMethod = input.value.trim();
    if (!newMethod) { alert("Введіть назву способу доставки"); return; }
    if (deliveryMethodsList.some(m => m.title === newMethod)) {
      alert("Такий спосіб вже існує!");
      return;
    }
    deliveryMethodsList.push({ key: newMethod, title: newMethod });
    initDeliveryButtons();
    input.value = "";
  }
  
  function updateComplexitySelectors() {
    const select = document.getElementById("newShopComplexity");
    if (select) {
      select.innerHTML = `
        <option value="легко">${complexityNames["легко"].icon} ${complexityNames["легко"].title}</option>
        <option value="потно">${complexityNames["потно"].icon} ${complexityNames["потно"].title}</option>
        <option value="тяжко">${complexityNames["тяжко"].icon} ${complexityNames["тяжко"].title}</option>
      `;
    }
  }
  
  // АВТОРИЗАЦІЯ
  function getUsers() {
    const users = localStorage.getItem("app_users");
    if (users) { try { return JSON.parse(users); } catch(e) {} }
    return {};
  }
  function saveUsers(users) { localStorage.setItem("app_users", JSON.stringify(users)); }
  
  let isLoginMode = true;
  function showAuthScreen() {
    const overlay = document.createElement('div');
    overlay.className = 'login-overlay';
    overlay.innerHTML = `<div class="login-card">
      <h2>🚛 Вантажник</h2>
      <p id="authModeText">${isLoginMode ? "Вхід" : "Реєстрація"}</p>
      <input type="text" id="usernameInput" placeholder="Ім'я" autocomplete="off">
      <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
      <button id="authBtn">${isLoginMode ? "Увійти" : "Зареєструватися"}</button>
      <div class="switch-mode" id="switchModeBtn">${isLoginMode ? "Немає акаунту? Зареєструватися" : "Вже є акаунт? Увійти"}</div>
      <div id="authError" class="error-msg"></div>
    </div>`;
    document.body.appendChild(overlay);
    
    document.getElementById('authBtn').onclick = () => {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const users = getUsers();
      if (isLoginMode) {
        if (users[username] && users[username].password === password) {
          currentUser = username;
          localStorage.setItem("app_current_user", username);
          overlay.remove();
          startApp();
        } else {
          document.getElementById('authError').textContent = "❌ Невірне ім'я або пароль";
        }
      } else {
        if (users[username]) {
          document.getElementById('authError').textContent = "❌ Користувач вже існує";
          return;
        }
        if (password !== BASE_PASSWORD) {
          document.getElementById('authError').textContent = "❌ Невірний пароль. Зверніться до адміністратора";
          return;
        }
        users[username] = { password };
        saveUsers(users);
        currentUser = username;
        localStorage.setItem("app_current_user", username);
        overlay.remove();
        startApp();
      }
    };
    document.getElementById('switchModeBtn').onclick = () => {
      isLoginMode = !isLoginMode;
      document.getElementById('authModeText').textContent = isLoginMode ? "Вхід" : "Реєстрація";
      document.getElementById('authBtn').textContent = isLoginMode ? "Увійти" : "Зареєструватися";
      document.getElementById('switchModeBtn').textContent = isLoginMode ? "Немає акаунту? Зареєструватися" : "Вже є акаунт? Увійти";
      document.getElementById('authError').textContent = "";
    };
  }
  
  function startApp() {
    const appContainer = document.getElementById('app');
    appContainer.innerHTML = `<div class="container">
      <div class="header">
        <h1>🚛 Вантажник <small>довідник</small></h1>
        <div class="user-greeting">👤 ${currentUser} <button class="logout-btn" id="logoutBtn">🚪 Вийти</button></div>
      </div>
      
      <div class="sync-panel">
        <div class="sync-title">☁️ ПІДКЛЮЧЕННЯ ДО БАЗИ</div>
        <button id="loadDataBtn" class="btn-full btn-green">📥 ЗАВАНТАЖИТИ ДАНІ</button>
        <div class="sync-status" id="syncStatus">⚙️ Натисніть "ЗАВАНТАЖИТИ"</div>
      </div>
      
      <div class="action-card">
        <h3>🔍 ПЕРЕВІРИТИ МАГАЗИН</h3>
        <div class="row-input">
          <input type="number" id="checkShopInput" placeholder="Номер магазину" disabled>
          <button id="checkShopBtn" class="btn-gray" disabled>Підказка</button>
        </div>
        <div id="checkResult" class="check-result">🔒 Спочатку завантажте дані</div>
      </div>
      
      <div class="action-card">
        <h3>➕ ДОДАТИ МАГАЗИН</h3>
        <div class="row-input">
          <input type="number" id="newShopNumber" placeholder="Номер магазину" disabled>
          <select id="newShopColor" disabled>
            <option value="білі">⚪ Білі</option>
            <option value="сірі">⚫ Сірі</option>
            <option value="чорні">⬛ Чорні</option>
          </select>
          <select id="newShopComplexity" disabled></select>
        </div>
        <div class="delivery-buttons" id="deliveryButtons"></div>
        <div class="add-delivery-row">
          <input type="text" id="newDeliveryInput" placeholder="Новий спосіб доставки..." disabled>
          <button id="addDeliveryBtn" class="btn-green" disabled>➕ Додати</button>
        </div>
        <textarea id="shopDescriptionInput" rows="2" placeholder="Короткий опис (не обов'язково)" disabled></textarea>
        <button id="addShopBtn" class="btn-full btn-blue" style="margin-top:12px;" disabled>✅ ДОДАТИ МАГАЗИН</button>
      </div>
      
      <div class="categories-grid" id="categoriesGrid"><div class="data-placeholder">🔒 Натисніть "ЗАВАНТАЖИТИ"</div></div>
      
      <footer>
        <button id="forgetBtn" class="btn-red" style="padding:10px 20px; font-size:0.7rem; border-radius:30px;">⚠️ Забути всі дані</button>
      </footer>
    </div>`;
    
    updateComplexitySelectors();
    
    document.getElementById("loadDataBtn").onclick = async () => {
      await loadData();
      document.getElementById("checkShopInput").disabled = false;
      document.getElementById("checkShopBtn").disabled = false;
      document.getElementById("newShopNumber").disabled = false;
      document.getElementById("newShopColor").disabled = false;
      document.getElementById("newShopComplexity").disabled = false;
      document.getElementById("addDeliveryBtn").disabled = false;
      document.getElementById("newDeliveryInput").disabled = false;
      document.getElementById("addShopBtn").disabled = false;
      document.getElementById("shopDescriptionInput").disabled = false;
    };
    document.getElementById("checkShopBtn").onclick = checkShop;
    document.getElementById("addShopBtn").onclick = addNewShop;
    document.getElementById("addDeliveryBtn").onclick = addCustomDelivery;
    document.getElementById("forgetBtn").onclick = () => {
      if (confirm("⚠️ ВИДАЛИТИ ВСІ ДАНІ?")) {
        localStorage.clear();
        location.reload();
      }
    };
    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("app_current_user");
      location.reload();
    };
    
    const descInput = document.getElementById("shopDescriptionInput");
    if (descInput) descInput.oninput = (e) => { currentDescription = e.target.value; };
  }
  
  const savedUser = localStorage.getItem("app_current_user");
  if (savedUser) {
    const users = getUsers();
    if (users[savedUser]) {
      currentUser = savedUser;
      startApp();
    } else {
      showAuthScreen();
    }
  } else {
    showAuthScreen();
  }
</script>
</body>
</html>
