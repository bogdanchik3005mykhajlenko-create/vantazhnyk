<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#2c7da0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Вантажник">
  <title>Вантажники-водії</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, #e2e9f0 0%, #cfdbe5 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; color: #1a3a44; flex-wrap: wrap; gap: 8px; }
    h1 small { font-size: 0.65rem; background: #2c7da0; color: white; padding: 4px 10px; border-radius: 40px; }
    .sub { color: #2c5a6e; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #aac7d6; font-size: 0.8rem; }
    .user-greeting { background: #d4edda; color: #155724; padding: 6px 12px; border-radius: 30px; font-size: 0.7rem; display: inline-block; margin-bottom: 10px; }
    
    .sync-panel {
      background: #e8f4f8;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid #b8d4e3;
    }
    .sync-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 8px; }
    .sync-row { 
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .input-group label {
      font-size: 0.7rem;
      font-weight: bold;
      color: #2c5a6e;
      min-width: 55px;
    }
    .input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbdae2;
      border-radius: 30px;
      font-size: 0.8rem;
    }
    .saved-key-badge {
      background: #d4edda;
      color: #155724;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .saved-key-badge:active {
      background: #c3e6cb;
      transform: scale(0.97);
    }
    .key-badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.7rem;
    }
    .sync-row-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .sync-row-buttons button {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      font-size: 0.75rem;
    }
    .btn-save { background: #6c757d; color: white; }
    .btn-clear { background: #dc3545; color: white; }
    .btn-forget { background: #343a40; color: white; }
    .btn-down { background: #28a745; color: white; }
    .btn-up { background: #ffc107; color: #333; }
    .sync-status { font-size: 0.7rem; color: #2c5a6e; margin-top: 8px; padding: 6px; background: rgba(255,255,255,0.5); border-radius: 12px; }
    .sync-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .sync-buttons button { flex: 1; min-width: 100px; }
    
    .action-panel { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .check-card, .add-card { background: white; border-radius: 18px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h3 { margin-bottom: 10px; font-size: 1rem; }
    .check-input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .check-input-group input { flex: 2; padding: 14px; border: 2px solid #cbdae2; border-radius: 30px; font-size: 1rem; }
    button { background: #2c7da0; border: none; padding: 12px 20px; border-radius: 40px; font-weight: 600; color: white; cursor: pointer; min-height: 44px; }
    button:active { transform: scale(0.96); }
    .check-result { margin-top: 12px; padding: 12px; background: #eef3fa; border-radius: 16px; font-size: 0.9rem; border-left: 4px solid #2c7da0; }
    .select-group { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .select-group input, .select-group select { padding: 14px; border-radius: 30px; border: 1px solid #bccbd4; font-size: 1rem; width: 100%; }
    
    .delivery-methods {
      margin-top: 12px;
    }
    .delivery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .delivery-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #2c5a6e;
    }
    .edit-mode-btn {
      background: #6c757d;
      padding: 6px 12px;
      font-size: 0.65rem;
      min-height: auto;
    }
    .edit-mode-btn.active {
      background: #dc3545;
    }
    .delivery-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 16px;
      min-height: 60px;
    }
    .delivery-item {
      display: inline-flex;
      align-items: center;
      gap: 0;
      background: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 30px;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .delivery-item.edit-mode {
      background: #fff0f0;
      border-color: #dc3545;
    }
    .delivery-btn {
      background: #e9ecef;
      border: none;
      padding: 8px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .delivery-item.edit-mode .delivery-btn {
      background: #fff0f0;
      padding-right: 4px;
    }
    .delivery-btn.selected {
      background: #2c7da0;
      color: white;
    }
    .delete-delivery-btn {
      background: #dc3545;
      border: none;
      padding: 8px 10px;
      font-size: 0.7rem;
      cursor: pointer;
      color: white;
      font-weight: bold;
      min-height: auto;
      width: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    .delivery-item.edit-mode .delete-delivery-btn {
      width: auto;
      opacity: 1;
      padding: 8px 10px;
    }
    .delete-delivery-btn:active {
      transform: scale(0.95);
    }
    .add-delivery-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-delivery-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbdae2;
      border-radius: 30px;
      font-size: 0.8rem;
    }
    .add-delivery-row button {
      padding: 8px 16px;
      font-size: 0.7rem;
      background: #28a745;
      white-space: nowrap;
    }
    
    .shop-description-area {
      margin-top: 12px;
    }
    .shop-description-area textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbdae2;
      border-radius: 16px;
      font-size: 0.8rem;
      resize: vertical;
      font-family: inherit;
    }
    
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 20px;
    }
    .category-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .category-card:active { transform: scale(0.97); }
    .cat-header {
      padding: 10px 4px;
      text-align: center;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .white-header { background: #e3e8ee; color: #1e3a4a; border-bottom: 3px solid #2c7da0; }
    .gray-header { background: #5a6e78; color: white; border-bottom: 3px solid #2c3e42; }
    .black-header { background: #1e2a2e; color: white; border-bottom: 3px solid #f39c12; }
    .cat-body { padding: 10px; text-align: center; }
    .cat-count { font-size: 1.8rem; font-weight: bold; color: #2c7da0; }
    .cat-label { font-size: 0.65rem; color: #6c757d; margin-top: 4px; }
    .empty-cat { opacity: 0.5; }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }
    .modal-content {
      background: white;
      border-radius: 28px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #e9ecef;
    }
    .modal-list { flex: 1; overflow-y: auto; padding: 12px; }
    .modal-shop-item {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .modal-shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .modal-shop-num { 
      font-weight: bold; 
      font-size: 1rem; 
      background: #2c7da0; 
      color: white; 
      padding: 4px 12px; 
      border-radius: 30px; 
    }
    .modal-shop-delivery {
      font-size: 0.75rem;
      color: #2c7da0;
      background: #e8f4f8;
      padding: 4px 10px;
      border-radius: 30px;
      display: inline-block;
      margin: 4px 0;
    }
    .modal-shop-description {
      font-size: 0.75rem;
      color: #555;
      background: #f0f0f0;
      padding: 8px;
      border-radius: 12px;
      margin-top: 8px;
    }
    .delete-shop-modal { 
      background: #ffe0e0; 
      border: none; 
      padding: 5px 12px; 
      border-radius: 30px; 
      color: #b91c1c; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.7rem; 
    }
    .edit-shop-modal {
      background: #e3f2fd;
      border: none;
      padding: 5px 12px;
      border-radius: 30px;
      color: #2c7da0;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .empty-modal { text-align: center; color: #8c9aa8; padding: 32px; font-style: italic; }
    
    .warning-modal .modal-header { background: #fff0f0; color: #b91c1c; }
    .deleted-list { background: #fff0f0; border-radius: 12px; padding: 10px; margin: 10px 0; max-height: 150px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; }
    .deleted-list span { background: #b91c1c; color: white; padding: 6px 14px; border-radius: 30px; font-size: 0.9rem; }
    .btn-cancel { background: #6c757d; color: white; margin: 0 20px 12px; }
    .btn-proceed { background: #dc3545; color: white; margin: 0 20px 20px; }
    
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #1a3a44 0%, #2c7da0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .login-card {
      background: white;
      border-radius: 32px;
      padding: 28px 20px;
      width: 85%;
      max-width: 340px;
      text-align: center;
    }
    .login-card h2 { margin-bottom: 8px; color: #1a3a44; font-size: 1.3rem; }
    .login-card p { color: #6c757d; font-size: 0.75rem; margin-bottom: 20px; }
    .login-card input { width: 100%; padding: 14px; border: 2px solid #cbdae2; border-radius: 40px; font-size: 1rem; margin-bottom: 16px; text-align: center; }
    .login-card button { width: 100%; background: #2c7da0; padding: 14px; font-size: 1rem; margin-top: 8px; }
    .login-card button:active { transform: scale(0.96); }
    .error-msg { color: #dc3545; font-size: 0.75rem; margin-top: 10px; }
    .switch-mode { margin-top: 16px; font-size: 0.75rem; color: #2c7da0; cursor: pointer; text-decoration: underline; }
    
    footer { margin-top: 20px; text-align: center; font-size: 0.6rem; color: #3a6b7c; padding: 12px; }
    @media (min-width: 700px) { 
      .action-panel { flex-direction: row; } 
      .select-group { flex-direction: row; } 
      .select-group input { flex: 2; } 
      .select-group select { flex: 1; }
      .sync-row { flex-direction: row; flex-wrap: wrap; }
      .input-group { flex: 1; }
      .sync-row-buttons { flex: 1; justify-content: flex-end; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  const BASE_PASSWORD = "Закони водіїв";
  
  let globalDeliveryMethodsList = [
    { key: "рокля_до_підсобки", title: "🛒 Рокля до підсобки" },
    { key: "рокля_далеко", title: "🚶 Рокля + далеко" },
    { key: "рокля_гора", title: "⛰️ Рокля + гора" },
    { key: "рокля_вузько", title: "🚫 Рокля + вузько" },
    { key: "рокля_поріг", title: "📏 Рокля + поріг" },
    { key: "розрив_перед_весь", title: "📦 Розрив перед → весь магазин" },
    { key: "розрив_перед_коротко", title: "📦 Розрив перед → коротко" },
    { key: "розрив_всередині_весь", title: "🏪 Розрив всередині → весь магазин" },
    { key: "розрив_всередині_коротко", title: "🏪 Розрив всередині → коротко" },
    { key: "розрив_біля_підсобки", title: "🚪 Розрив біля підсобки" },
    { key: "другий_поверх_руками", title: "🏢 2й поверх → руками" }
  ];

  let shops = {
    "білі": { "легко": [], "потно": [], "тяжко": [] },
    "сірі": { "легко": [], "потно": [], "тяжко": [] },
    "чорні": { "легко": [], "потно": [], "тяжко": [] }
  };
  let shopDeliveries = {};
  let shopDescriptions = {};
  let config = { apiKey: "", binId: "" };
  let selectedDelivery = "";
  let currentShopDescription = "";
  let lastSnapshotShopsSet = new Set();
  let lastSnapshotDeliveriesHash = "";
  let isEditMode = false;
  
  function getAllShopNumbers() {
    const set = new Set();
    for (const color of ["білі","сірі","чорні"]) {
      for (const comp of ["легко","потно","тяжко"]) {
        for (const num of shops[color][comp]) set.add(num);
      }
    }
    return set;
  }
  
  function getDeliveriesHash() {
    return JSON.stringify(globalDeliveryMethodsList);
  }
  
  function updateSnapshot() { 
    lastSnapshotShopsSet = getAllShopNumbers();
    lastSnapshotDeliveriesHash = getDeliveriesHash();
  }
  
  function hasDeliveryMethodChanges() {
    return lastSnapshotDeliveriesHash !== getDeliveriesHash();
  }
  
  function getDeletedShops() {
    const currentSet = getAllShopNumbers();
    const deleted = [];
    for (const shop of lastSnapshotShopsSet) {
      if (!currentSet.has(shop)) deleted.push(shop);
    }
    return deleted;
  }
  
  function hasLocalChanges() {
    const currentSet = getAllShopNumbers();
    if (currentSet.size !== lastSnapshotShopsSet.size) return true;
    for (const shop of currentSet) {
      if (!lastSnapshotShopsSet.has(shop)) return true;
    }
    return hasDeliveryMethodChanges();
  }
  
  function saveUserData() {
    if (!currentUser) return;
    const users = getUsers();
    users[currentUser] = {
      password: BASE_PASSWORD,
      shops: shops,
      deliveries: shopDeliveries,
      descriptions: shopDescriptions,
      config: config
    };
    saveUsers(users);
  }
  
  function saveGlobalDeliveryMethodsToCloud() {
    if (!config.apiKey || !config.binId) return;
    fetch(`https://api.jsonbin.io/v3/b/${config.binId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": config.apiKey },
      body: JSON.stringify({ 
        shops: shops, 
        deliveries: shopDeliveries,
        descriptions: shopDescriptions,
        deliveryMethods: globalDeliveryMethodsList
      })
    }).catch(e => console.error("Помилка збереження:", e));
  }
  
  function getUsers() {
    const users = localStorage.getItem("app_users");
    if (users) {
      try { return JSON.parse(users); } catch(e) {}
    }
    return {};
  }
  
  function saveUsers(users) {
    localStorage.setItem("app_users", JSON.stringify(users));
  }
  
  let currentUser = null;
  
  function loadUserData(username) {
    const users = getUsers();
    const userData = users[username];
    if (userData) {
      shops = userData.shops || {
        "білі": { "легко": [], "потно": [], "тяжко": [] },
        "сірі": { "легко": [], "потно": [], "тяжко": [] },
        "чорні": { "легко": [], "потно": [], "тяжко": [] }
      };
      shopDeliveries = userData.deliveries || {};
      shopDescriptions = userData.descriptions || {};
      config = userData.config || { apiKey: "", binId: "" };
    } else {
      shops = {
        "білі": { "легко": [], "потно": [], "тяжко": [] },
        "сірі": { "легко": [], "потно": [], "тяжко": [] },
        "чорні": { "легко": [], "потно": [], "тяжко": [] }
      };
      shopDeliveries = {};
      shopDescriptions = {};
      config = { apiKey: "", binId: "" };
      initDemo();
    }
    updateSnapshot();
    if (typeof renderCategories === 'function') renderCategories();
    if (typeof updateSavedKeysDisplay === 'function') updateSavedKeysDisplay();
  }
  
  function loadConfig() {
    if (currentUser) {
      const users = getUsers();
      const userData = users[currentUser];
      if (userData && userData.config) {
        config = userData.config;
      }
      const apiInput = document.getElementById("apiKeyInput");
      const binInput = document.getElementById("binIdInput");
      if (apiInput) apiInput.value = config.apiKey || "";
      if (binInput) binInput.value = config.binId || "";
    }
    updateSavedKeysDisplay();
  }
  
  function updateSavedKeysDisplay() {
    const container = document.getElementById("savedKeysContainer");
    if (!container) return;
    let html = '';
    if (config.apiKey && config.apiKey.length > 3) {
      const maskedApi = config.apiKey.slice(0, 8) + '••••••••';
      html += `<span class="saved-key-badge" data-keytype="api" data-keyvalue="${config.apiKey}">🔑 API: ${maskedApi}</span>`;
    }
    if (config.binId && config.binId.length > 3) {
      const maskedBin = config.binId.slice(0, 6) + '••••••';
      html += `<span class="saved-key-badge" data-keytype="bin" data-keyvalue="${config.binId}">📦 Bin: ${maskedBin}</span>`;
    }
    if (!config.apiKey && !config.binId) {
      html = '<span style="font-size:0.65rem; color:#6c757d;">💾 Немає збережених ключів</span>';
    }
    container.innerHTML = html;
    document.querySelectorAll('.saved-key-badge').forEach(badge => {
      badge.onclick = (e) => {
        e.stopPropagation();
        const keyType = badge.dataset.keytype;
        const keyValue = badge.dataset.keyvalue;
        if (keyType === 'api') {
          document.getElementById("apiKeyInput").value = keyValue;
          document.getElementById("syncStatus").innerHTML = "✅ API ключ вставлено!";
        } else if (keyType === 'bin') {
          document.getElementById("binIdInput").value = keyValue;
          document.getElementById("syncStatus").innerHTML = "✅ Bin ID вставлено!";
        }
      };
    });
  }
  
  function saveConfig() {
    config.apiKey = document.getElementById("apiKeyInput").value.trim();
    config.binId = document.getElementById("binIdInput").value.trim();
    saveUserData();
    updateSavedKeysDisplay();
    const statusEl = document.getElementById("syncStatus");
    if (statusEl) {
      if (config.apiKey && config.binId) {
        statusEl.innerHTML = "✅ Ключі збережено!";
      } else {
        statusEl.innerHTML = "⚠️ Введіть обидва ключі";
      }
    }
  }
  
  function clearConfig() {
    if (confirm("Очистити збережені ключі?")) {
      config.apiKey = "";
      config.binId = "";
      saveUserData();
      document.getElementById("apiKeyInput").value = "";
      document.getElementById("binIdInput").value = "";
      updateSavedKeysDisplay();
      const statusEl = document.getElementById("syncStatus");
      if (statusEl) statusEl.innerHTML = "🗑 Ключі очищено";
    }
  }
  
  async function download() {
    if (!config.apiKey || !config.binId) {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const binId = document.getElementById("binIdInput").value.trim();
      if (apiKey && binId) {
        config.apiKey = apiKey;
        config.binId = binId;
        saveUserData();
      } else {
        const statusEl = document.getElementById("syncStatus");
        if (statusEl) statusEl.innerHTML = "⚠️ Введіть API ключ та ID Bin!";
        return;
      }
    }
    if (hasLocalChanges()) {
      if (!confirm("⚠️ У вас є незбережені зміни. Завантажити з хмари? Локальні зміни будуть втрачені.")) {
        const statusEl = document.getElementById("syncStatus");
        if (statusEl) statusEl.innerHTML = "⏸️ Завантаження скасовано";
        return;
      }
    }
    const statusEl = document.getElementById("syncStatus");
    if (statusEl) statusEl.innerHTML = "📥 Завантаження...";
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${config.binId}/latest`, {
        headers: { "X-Master-Key": config.apiKey }
      });
      if (res.ok) {
        const data = await res.json();
        if (data.record && data.record.shops) {
          shops = data.record.shops;
          shopDeliveries = data.record.deliveries || {};
          shopDescriptions = data.record.descriptions || {};
          if (data.record.deliveryMethods && Array.isArray(data.record.deliveryMethods)) {
            globalDeliveryMethodsList = data.record.deliveryMethods;
          }
          saveUserData();
          updateSnapshot();
          if (typeof renderCategories === 'function') renderCategories();
          if (typeof initDeliveryButtons === 'function') initDeliveryButtons();
          if (statusEl) statusEl.innerHTML = "✅ Завантажено!";
        } else {
          await upload(true);
          if (statusEl) statusEl.innerHTML = "✅ Ініціалізовано!";
        }
      } else {
        if (statusEl) statusEl.innerHTML = "❌ Помилка завантаження";
      }
    } catch(e) {
      if (statusEl) statusEl.innerHTML = "❌ Немає інтернету";
    }
  }
  
  async function upload(force = false) {
    if (!config.apiKey || !config.binId) {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const binId = document.getElementById("binIdInput").value.trim();
      if (apiKey && binId) {
        config.apiKey = apiKey;
        config.binId = binId;
        saveUserData();
      } else {
        const statusEl = document.getElementById("syncStatus");
        if (statusEl) statusEl.innerHTML = "⚠️ Введіть API ключ та ID Bin!";
        return;
      }
    }
    const deletedShops = getDeletedShops();
    if (!force && deletedShops.length > 0) {
      showDeletionWarning(deletedShops, () => upload(true), () => {
        const statusEl = document.getElementById("syncStatus");
        if (statusEl) statusEl.innerHTML = "⏸️ Відправлення скасовано";
      });
      return;
    }
    const statusEl = document.getElementById("syncStatus");
    if (statusEl) statusEl.innerHTML = "📤 Відправка...";
    try {
      const data = { 
        shops: shops, 
        deliveries: shopDeliveries,
        descriptions: shopDescriptions,
        deliveryMethods: globalDeliveryMethodsList
      };
      const res = await fetch(`https://api.jsonbin.io/v3/b/${config.binId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": config.apiKey },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        updateSnapshot();
        if (statusEl) statusEl.innerHTML = "✅ Відправлено!";
      } else {
        if (statusEl) statusEl.innerHTML = "❌ Помилка відправлення";
      }
    } catch(e) {
      if (statusEl) statusEl.innerHTML = "❌ Немає інтернету";
    }
  }
  
  function addShop(num, color, comp, delivery, description) {
    const n = Number(num);
    if (isNaN(n)) return;
    for (let c of ["білі","сірі","чорні"]) {
      for (let cp of ["легко","потно","тяжко"]) {
        shops[c][cp] = shops[c][cp].filter(i => i !== n);
      }
    }
    shops[color][comp].push(n);
    shops[color][comp].sort((a,b)=>a-b);
    if (delivery) shopDeliveries[n] = delivery;
    if (description && description.trim()) shopDescriptions[n] = description.trim();
    saveUserData();
    if (typeof renderCategories === 'function') renderCategories();
    const statusEl = document.getElementById("syncStatus");
    if (statusEl) statusEl.innerHTML = "✅ Магазин додано!";
  }
  
  function removeShop(n, color, comp) {
    shops[color][comp] = shops[color][comp].filter(i => i !== n);
    delete shopDeliveries[n];
    delete shopDescriptions[n];
    saveUserData();
    if (typeof renderCategories === 'function') renderCategories();
    const statusEl = document.getElementById("syncStatus");
    if (statusEl) statusEl.innerHTML = "✅ Магазин видалено!";
  }
  
  function updateShop(n, color, comp, delivery, description) {
    removeShop(n, color, comp);
    addShop(n, color, comp, delivery, description);
  }
  
  function getDeliveryText(key) {
    const found = globalDeliveryMethodsList.find(d => d.key === key);
    return found ? found.title : key;
  }
  
  function addNewDeliveryMethod() {
    const input = document.getElementById("newDeliveryInput");
    const newTitle = input.value.trim();
    if (!newTitle) {
      alert("Введіть назву способу доставки");
      return;
    }
    const exists = globalDeliveryMethodsList.some(d => d.title === newTitle);
    if (exists) {
      alert("Такий спосіб доставки вже існує!");
      return;
    }
    const newKey = "custom_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
    globalDeliveryMethodsList.push({ key: newKey, title: newTitle });
    saveUserData();
    initDeliveryButtons();
    input.value = "";
    if (config.apiKey && config.binId) {
      saveGlobalDeliveryMethodsToCloud();
      const statusEl = document.getElementById("syncStatus");
      if (statusEl) statusEl.innerHTML = `✅ Додано новий спосіб доставки: ${newTitle} (синхронізовано)`;
    } else {
      const statusEl = document.getElementById("syncStatus");
      if (statusEl) statusEl.innerHTML = `✅ Додано новий спосіб доставки: ${newTitle}`;
    }
  }
  
  function deleteDeliveryMethod(key, title) {
    if (confirm(`⚠️ Видалити спосіб доставки "${title}"?\n\nУвага! Якщо цей спосіб використовується для якихось магазинів, у них зникне спосіб доставки.`)) {
      globalDeliveryMethodsList = globalDeliveryMethodsList.filter(d => d.key !== key);
      for (const shop in shopDeliveries) {
        if (shopDeliveries[shop] === key) {
          delete shopDeliveries[shop];
        }
      }
      saveUserData();
      initDeliveryButtons();
      if (selectedDelivery === key) {
        selectedDelivery = "";
      }
      if (config.apiKey && config.binId) {
        saveGlobalDeliveryMethodsToCloud();
        const statusEl = document.getElementById("syncStatus");
        if (statusEl) statusEl.innerHTML = `🗑 Видалено спосіб доставки: ${title} (синхронізовано)`;
      } else {
        const statusEl = document.getElementById("syncStatus");
        if (statusEl) statusEl.innerHTML = `🗑 Видалено спосіб доставки: ${title}`;
      }
    }
  }
  
  function toggleEditMode() {
    isEditMode = !isEditMode;

        editBtn.textContent = "✅ Готово";

  function openCategoryModal(color, complexity) {
    const shopsList = shops[color][complexity] || [];
    const colorNames = { "білі":"⚪ БІЛІ", "сірі":"⚫ СІРІ", "чорні":"⬛ ЧОРНІ" };

    overlay.className = 'modal-overlay';
    let listHtml = '';
    if (shopsList.length === 0) {
      listHtml = '<div class="empty-modal">✖️ Немає магазинів</div>';
    } else {
      listHtml = shopsList.map(shop => {
        const delivery = getDeliveryText(shopDeliveries[shop]);
        const description = shopDescriptions[shop] || "";
        return `<div class="modal-shop-item">
          <div class="modal-shop-header">
            <span class="modal-shop-num">${shop}</span>

          ${description ? `<div class="modal-shop-description">📝 Опис: ${description}</div>` : ''}

      }).join('');
    }
    overlay.innerHTML = `<div class="modal-content">
      <div class="modal-header" style="background:#2c7da0; color:white;">${colorNames[color]} · ${compNames[complexity]}</div>
      <div class="modal-list">${listHtml}</div>
      <button class="modal-close" id="closeModalBtn">Закрити</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelectorAll('.delete-shop-modal').forEach(btn => {

        const shopNum = parseInt(btn.dataset.shop);

          removeShop(shopNum, btn.dataset.color, btn.dataset.comp);
          overlay.remove();
          openCategoryModal(color, complexity);
        }
      };
    });
    overlay.querySelectorAll('.edit-shop-modal').forEach(btn => {

        e.stopPropagation();

  function renderCategories() {
    const container = document.getElementById("categoriesGrid");
    if (!container) return;
    const colors = ["білі", "сірі", "чорні"];
    const comps = ["легко", "потно", "тяжко"];

    const compIcons = { "легко": "🟢", "потно": "💦", "тяжко": "⛰️" };
    let html = '';
    for (let color of colors) {
      for (let comp of comps) {

        html += `<div class="category-card" data-color="${color}" data-comp="${comp}">
          <div class="cat-header ${headerClass[color]}">${colorTitles[color]}</div>

  function checkShop() {
    let v = document.getElementById("checkShopInput").value.trim();
    if (!v) { 
      const resultEl = document.getElementById("checkResult");
      if (resultEl) resultEl.innerHTML = "⚠️ Введіть номер";
      return; 
    }
    let num = Number(v);
    if (isNaN(num)) { 
      const resultEl = document.getElementById("checkResult");
      if (resultEl) resultEl.innerHTML = "❌ Помилка";
      return; 
    }
    let found = null;
    for (let c of ["білі","сірі","чорні"]) {
      for (let cp of ["легко","потно","тяжко"]) {
        if (shops[c][cp].includes(num)) found = { color: c, comp: cp };
      }
    }
    const resultEl = document.getElementById("checkResult");
    if (found) {
      let delivery = getDeliveryText(shopDeliveries[num]);
      let description = shopDescriptions[num] || "";
      let details = `<strong>🏪 Магазин ${num}</strong><br>📌 ${found.color}, ${found.comp}`;
      if (delivery) details += `<br>🚚 Спосіб доставки: ${delivery}`;
      if (description) details += `<br>📋 Опис: ${description}`;
      if (resultEl) resultEl.innerHTML = details;
    } else {
      if (resultEl) resultEl.innerHTML = `<strong>🏪 Магазин ${num}</strong><br>⚠️ Немає даних`;
    }
  }

    if (!num) { alert("Введіть номер"); return; }
    addShop(Number(num), 
      document.getElementById("newShopColor").value,

  function initDeliveryButtons() {
    const container = document.getElementById("deliveryButtons");
    if (!container) return;
    container.innerHTML = "";
    globalDeliveryMethodsList.forEach(delivery => {
      const itemDiv = document.createElement("div");
      itemDiv.className = "delivery-item";
      if (isEditMode) itemDiv.classList.add("edit-mode");
      const btn = document.createElement("div");
      btn.className = "delivery-btn";
      btn.textContent = delivery.title;
      btn.dataset.delivery = delivery.key;
      btn.onclick = () => {
        if (!isEditMode) {
          document.querySelectorAll('#deliveryButtons .delivery-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedDelivery = delivery.key;
        }
      };
      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-delivery-btn";
      deleteBtn.textContent = "✖";
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        if (isEditMode) {
          deleteDeliveryMethod(delivery.key, delivery.title);
        }
      };
      itemDiv.appendChild(btn);
      itemDiv.appendChild(deleteBtn);
      container.appendChild(itemDiv);
    });
  }

  function forgetEverything() {
    if (confirm("⚠️ ВИДАЛИТИ ВСІ ДАНІ КОРИСТУВАЧА? Це видалить всі магазини, ключі та налаштування!")) {

  let isLoginMode = true;
  
  function showAuthScreen() {
    const overlay = document.createElement('div');
    overlay.className = 'login-overlay';
    overlay.id = 'loginOverlay';
    overlay.innerHTML = `<div class="login-card">
      <h2>🚛 Вантажники-водії</h2>
      <p id="authModeText">${isLoginMode ? "Вхід в систему" : "Створення акаунту"}</p>
      <input type="text" id="usernameInput" placeholder="Ім'я користувача" autocomplete="off">
      <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
      <button id="authBtn">${isLoginMode ? "Увійти" : "Зареєструватися"}</button>
      <div class="switch-mode" id="switchModeBtn">${isLoginMode ? "Немає акаунту? Зареєструватися" : "Вже є акаунт? Увійти"}</div>
      <div id="authError" class="error-msg"></div>
    </div>`;
    document.body.appendChild(overlay);
    const authBtn = document.getElementById('authBtn');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const switchBtn = document.getElementById('switchModeBtn');
    const authModeText = document.getElementById('authModeText');
    const authError = document.getElementById('authError');
    function attemptAuth() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username) {
        authError.textContent = "❌ Введіть ім'я користувача";
        return;
      }
      if (!password) {
        authError.textContent = "❌ Введіть пароль";
        return;
      }
      const users = getUsers();
      if (isLoginMode) {
        if (users[username] && users[username].password === password) {
          currentUser = username;
          localStorage.setItem("app_current_user", username);
          document.getElementById('loginOverlay')?.remove();
          showMainApp();
        } else {
          authError.textContent = "❌ Невірне ім'я користувача або пароль";
          passwordInput.value = "";
        }
      } else {
        if (users[username]) {
          authError.textContent = "❌ Користувач з таким ім'ям вже існує";
          return;
        }
        if (password !== BASE_PASSWORD) {
          authError.textContent = `❌ Пароль має бути: "${BASE_PASSWORD}"`;
          return;
        }
        users[username] = {
          password: password,
          shops: {
            "білі": { "легко": [], "потно": [], "тяжко": [] },
            "сірі": { "легко": [], "потно": [], "тяжко": [] },
            "чорні": { "легко": [], "потно": [], "тяжко": [] }
          },
          deliveries: {},
          descriptions: {},
          config: { apiKey: "", binId: "" }
        };
        saveUsers(users);
        currentUser = username;
        localStorage.setItem("app_current_user", username);
        shops = users[username].shops;
        shopDeliveries = users[username].deliveries;
        shopDescriptions = users[username].descriptions;
        config = users[username].config;
        initDemo();
        saveUserData();
        document.getElementById('loginOverlay')?.remove();
        showMainApp();
      }
    }
    switchBtn.onclick = () => {
      isLoginMode = !isLoginMode;
      authModeText.textContent = isLoginMode ? "Вхід в систему" : "Створення акаунту";
      authBtn.textContent = isLoginMode ? "Увійти" : "Зареєструватися";
      switchBtn.textContent = isLoginMode ? "Немає акаунту? Зареєструватися" : "Вже є акаунт? Увійти";
      authError.textContent = "";
      if (!isLoginMode) {
        passwordInput.placeholder = `Пароль (повинен бути "${BASE_PASSWORD}")`;
      } else {
        passwordInput.placeholder = "Пароль";
      }
    };
    authBtn.onclick = attemptAuth;
    usernameInput.onkeypress = (e) => { if (e.key === 'Enter') attemptAuth(); };
    passwordInput.onkeypress = (e) => { if (e.key === 'Enter') attemptAuth(); };
  }
  
  function showMainApp() {
    const appContainer = document.getElementById('app');
    appContainer.innerHTML = `<div class="container">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <h1>🚛 Вантажники-водії 📦 <small>синхронізація</small></h1>
        <div class="user-greeting">👤 ${currentUser} <button id="logoutBtn" style="background: none; border: none; color: #dc3545; font-size: 0.7rem; margin-left: 8px;">🚪 Вийти</button></div>
      </div>
      <div class="sub">🏬 Натисніть на категорію для перегляду магазинів</div>
      <div class="sync-panel">
        <div class="sync-title">☁️ СИНХРОНІЗАЦІЯ</div>
        <div class="sync-row">
          <div class="input-group"><label>🔑 API</label><input type="text" id="apiKeyInput" placeholder="API ключ" autocomplete="off"></div>
          <div class="input-group"><label>📦 Bin</label><input type="text" id="binIdInput" placeholder="ID Bin" autocomplete="off"></div>
        </div>
        <div class="key-badge-container" id="savedKeysContainer"></div>
        <div class="sync-row-buttons">
          <button id="saveConfigBtn" class="btn-save">💾 Зберегти</button>
          <button id="clearConfigBtn" class="btn-clear">🗑 Очистити</button>
          <button id="forgetAllBtn" class="btn-forget">⚠️ Забути все</button>
        </div>
        <div class="sync-buttons">
          <button id="syncDownBtn" class="btn-down">📥 Завантажити</button>
          <button id="syncUpBtn" class="btn-up">📤 Відправити</button>
        </div>
        <div class="sync-status" id="syncStatus">⚙️ Введіть ключі або натисніть "Завантажити"</div>
      </div>
      <div class="action-panel">
        <div class="check-card"><h3>🔍 Перевірити</h3><div class="check-input-group"><input type="number" id="checkShopInput" placeholder="Номер"><button id="checkShopBtn">Підказка</button></div><div id="checkResult" class="check-result">👆 Введіть номер</div></div>
        <div class="add-card">
          <h3>➕ Додати магазин</h3>
          <div class="select-group">
            <input type="number" id="newShopNumber" placeholder="Номер магазину">
            <select id="newShopColor"><option value="білі">⚪ Білі</option><option value="сірі">⚫ Сірі</option><option value="чорні">⬛ Чорні</option></select>
            <select id="newShopComplexity"><option value="легко">🟢 Легко</option><option value="потно">💦 Потно</option><option value="тяжко">⛰️ Тяжко</option></select>
          </div>
          <div class="delivery-methods">
            <div class="delivery-header">
              <span class="delivery-title">🚚 Спосіб доставки:</span>
              <button id="toggleEditModeBtn" class="edit-mode-btn">✏️ Редагувати способи</button>
            </div>
            <div class="delivery-buttons" id="deliveryButtons"></div>
            <div class="add-delivery-row">
              <input type="text" id="newDeliveryInput" placeholder="Новий спосіб доставки...">
              <button id="addDeliveryBtn">➕ Додати</button>
            </div>
          </div>
          <div class="shop-description-area">
            <div class="delivery-title">📋 Короткий опис магазину:</div>
            <textarea id="shopDescriptionInput" rows="3" placeholder="Наприклад: важкий під'їзд, високий поріг, вузький двір, незручна підсобка..."></textarea>
          </div>
          <button id="addShopBtn" style="width:100%; margin-top:12px;">✅ Додати магазин</button>
        </div>
      </div>
      <div class="categories-grid" id="categoriesGrid"></div>
      <footer>💡 Ключі зберігаються на вашому пристрої. Натисніть "Редагувати способи" → з'являться хрестики для видалення</footer>
    </div>`;
    loadConfig();
    initDeliveryButtons();
    updateSnapshot();
    renderCategories();
    updateSavedKeysDisplay();
    document.getElementById("saveConfigBtn").onclick = saveConfig;
    document.getElementById("clearConfigBtn").onclick = clearConfig;
    document.getElementById("forgetAllBtn").onclick = forgetEverything;
    document.getElementById("syncDownBtn").onclick = download;
    document.getElementById("syncUpBtn").onclick = () => upload(false);
    document.getElementById("checkShopBtn").onclick = checkShop;
    document.getElementById("addShopBtn").onclick = addFromMobile;
    document.getElementById("addDeliveryBtn").onclick = addNewDeliveryMethod;
    document.getElementById("toggleEditModeBtn").onclick = toggleEditMode;
    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("app_current_user");
      currentUser = null;
      location.reload();
    };
    const descInput = document.getElementById("shopDescriptionInput");
    if (descInput) {
      descInput.oninput = (e) => { currentShopDescription = e.target.value; };
    }
  }
  
  const savedUser = localStorage.getItem("app_current_user");
  if (savedUser) {
    const users = getUsers();
    if (users[savedUser]) {
      currentUser = savedUser;
      loadUserData(currentUser);
      showMainApp();
    } else {
      showAuthScreen();
    }
  } else {
    showAuthScreen();
  }
</script>
</body>
</html>
