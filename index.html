<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#2c7da0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Вантажник">
  <title>Вантажник-водій</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, #e2e9f0 0%, #cfdbe5 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: #1a3a44; }
    h1 small { font-size: 0.65rem; background: #2c7da0; color: white; padding: 4px 10px; border-radius: 40px; }
    .sub { color: #2c5a6e; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #aac7d6; font-size: 0.8rem; }
    
    .sync-panel {
      background: #e8f4f8;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid #b8d4e3;
    }
    .sync-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 8px; }
    .sync-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .sync-row input { flex: 2; padding: 10px 12px; border: 1px solid #cbdae2; border-radius: 30px; font-size: 0.8rem; }
    .sync-row button, .sync-buttons button { padding: 8px 16px; font-size: 0.8rem; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; }
    .btn-save { background: #6c757d; color: white; }
    .btn-down { background: #28a745; color: white; }
    .btn-up { background: #ffc107; color: #333; }
    .sync-status { font-size: 0.7rem; color: #2c5a6e; margin-top: 8px; }
    .sync-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    
    .action-panel { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .check-card, .add-card { background: white; border-radius: 18px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h3 { margin-bottom: 10px; font-size: 1.1rem; }
    .check-input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .check-input-group input { flex: 2; padding: 14px; border: 2px solid #cbdae2; border-radius: 30px; font-size: 1rem; }
    button { background: #2c7da0; border: none; padding: 12px 20px; border-radius: 40px; font-weight: 600; color: white; cursor: pointer; min-height: 48px; }
    button:active { transform: scale(0.96); }
    .check-result { margin-top: 12px; padding: 12px; background: #eef3fa; border-radius: 16px; font-size: 0.9rem; border-left: 4px solid #2c7da0; }
    .select-group { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .select-group input, .select-group select { padding: 14px; border-radius: 30px; border: 1px solid #bccbd4; font-size: 1rem; width: 100%; }
    .extra-options { margin-top: 12px; padding-top: 8px; border-top: 1px solid #dee2e6; }
    .extra-title { font-size: 0.75rem; font-weight: 600; color: #2c5a6e; margin-bottom: 8px; }
    .reason-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .reason-btn { background: #e9ecef; border: 1px solid #ced4da; padding: 8px 12px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; white-space: nowrap; }
    .reason-btn.selected { background: #2c7da0; color: white; border-color: #2c7da0; }
    .groups-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
    .group-col { background: rgba(255,255,255,0.92); border-radius: 20px; overflow: hidden; }
    .group-header { padding: 14px; font-size: 1.3rem; font-weight: bold; text-align: center; }
    .white-header { background: #ced4da; color: #1e2a2e; }
    .gray-header { background: #5f6c70; color: white; }
    .black-header { background: #1f2a2e; color: white; }
    .subgroup { border-bottom: 1px solid #e2e8f0; padding: 12px; }
    .subgroup-title { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
    .shop-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; }
    .shop-item { background: white; border-radius: 40px; padding: 6px 12px; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; border-left: 4px solid; flex-wrap: wrap; }
    .shop-number { font-weight: bold; font-size: 0.95rem; }
    .shop-reason { font-size: 0.65rem; color: #6c757d; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .edit-select { font-size: 0.7rem; padding: 4px 6px; border-radius: 30px; background: #f1f3f5; border: 1px solid #adb5bd; min-width: 90px; }
    .delete-shop { background: #ffe0e0; border: none; color: #b91c1c; font-weight: bold; font-size: 1rem; padding: 2px 8px; border-radius: 30px; cursor: pointer; }
    .empty-msg { color: #8c9aa8; font-style: italic; font-size: 0.8rem; padding: 6px 0; }
    footer { margin-top: 20px; text-align: center; font-size: 0.65rem; color: #3a6b7c; padding: 12px; }
    @media (min-width: 700px) { .action-panel { flex-direction: row; } .select-group { flex-direction: row; } .select-group input { flex: 2; } .select-group select { flex: 1; } }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 Вантажник-водій 🚛 <small>синхронізація</small></h1>
  <div class="sub">🏬 Магазини з другим поверхом, підвалами, пандусами</div>

  <div class="sync-panel">
    <div class="sync-title">☁️ СИНХРОНІЗАЦІЯ</div>
    <div class="sync-row">
      <input type="text" id="apiKeyInput" placeholder="API ключ">
      <input type="text" id="binIdInput" placeholder="ID Bin">
      <button id="saveConfigBtn" class="btn-save">💾 Зберегти</button>
    </div>
    <div class="sync-buttons">
      <button id="syncDownBtn" class="btn-down">📥 Завантажити</button>
      <button id="syncUpBtn" class="btn-up">📤 Відправити</button>
    </div>
    <div class="sync-status" id="syncStatus">⚙️ Введіть ключі</div>
  </div>

  <div class="action-panel">
    <div class="check-card">
      <h3>🔍 Перевірити</h3>
      <div class="check-input-group">
        <input type="number" id="checkShopInput" placeholder="Номер">
        <button id="checkShopBtn">Підказка</button>
      </div>
      <div id="checkResult" class="check-result">👆 Введіть номер</div>
    </div>

    <div class="add-card">
      <h3>➕ Додати</h3>
      <div class="select-group">
        <input type="number" id="newShopNumber" placeholder="Номер">
        <select id="newShopColor">
          <option value="білі">⚪ Білі</option>
          <option value="сірі">⚫ Сірі</option>
          <option value="чорні">⬛ Чорні</option>
        </select>
        <select id="newShopComplexity">
          <option value="легко">🟢 Легко</option>
          <option value="потно">💦 Потно</option>
          <option value="тяжко">⛰️ Тяжко</option>
        </select>
      </div>
      <div class="extra-options">
        <div class="extra-title">📝 Причина (гортай, якщо не вміщується):</div>
        <div class="reason-buttons" id="reasonButtons">
          <!-- 44 причини будуть додані через JS -->
        </div>
      </div>
      <button id="addShopBtn" style="width:100%; margin-top:12px;">✅ Додати</button>
    </div>
  </div>

  <div class="groups-grid" id="groupsGrid"></div>
  <footer>💡 Новий користувач: Зберегти ключі → Завантажити</footer>
</div>

<script>
  // ==================== 44 ПРИЧИНИ ДОСТАВКИ ====================
  const fullReasonsList = [
    { key: "рокля_підсобка", title: "🛒 Рокля до підсобки" },
    { key: "рокля_далеко", title: "🚶 Рокля + далеко" },
    { key: "рокля_гора", title: "⛰️ Рокля + гора" },
    { key: "рокля_вузько", title: "🚫 Рокля + вузько" },
    { key: "рокля_поріг", title: "📏 Рокля + поріг" },
    { key: "розрив_перед_весь", title: "📦 Розрив перед → весь магазин" },
    { key: "розрив_перед_коротко", title: "📦 Розрив перед → коротко" },
    { key: "розрив_всередині_весь", title: "🏪 Розрив всередині → весь магазин" },
    { key: "розрив_всередині_коротко", title: "🏪 Розрив всередині → коротко" },
    { key: "розрив_біля_підсобки", title: "🚪 Розрив біля підсобки" },
    { key: "розбір_вулиця", title: "🌧️ Розбір на вулиці" },
    { key: "розбір_рампа", title: "🚛 Розбір на рампі" },
    { key: "вузький_двір", title: "🚫 Вузький двір" },
    { key: "вузька_рампа", title: "🚫 Вузька рампа" },
    { key: "немає_пандуса", title: "🚫 Немає пандуса" },
    { key: "парковка_далеко", title: "🚶 Парковка далеко" },
    { key: "чорний_хід", title: "🚪 Чорний хід" },
    { key: "через_вітрину", title: "🪟 Через вітрину" },
    { key: "через_поріг", title: "📏 Через поріг" },
    { key: "сходи_вверх_мало", title: "📈 Сходи вверх (1-3)" },
    { key: "сходи_вниз_мало", title: "📉 Сходи вниз (1-3)" },
    { key: "сходи_круті", title: "📈📈 Круті сходи" },
    { key: "другий_поверх_руками", title: "🏢 2й поверх → руками" },
    { key: "другий_поверх_розрив_знизу", title: "🏢 2й поверх + розрив внизу" },
    { key: "другий_поверх_розрив_зверху", title: "🏢 2й поверх + розрив зверху" },
    { key: "підвал_один", title: "⬇️ Підвал 1 проліт" },
    { key: "підвал_глибокий", title: "⬇️⬇️ Глибокий підвал" },
    { key: "підвал_вузько", title: "⬇️🚫 Підвал + вузько" },
    { key: "підвал_далеко", title: "⬇️🚶 Підвал + далеко" },
    { key: "ліфт_розбір_внизу_далеко", title: "🛗 Розбір внизу → ліфт → далеко" },
    { key: "ліфт_розбір_внизу_коротко", title: "🛗 Розбір внизу → ліфт → коротко" },
    { key: "ліфт_палети_розбір_далеко", title: "🛗 Палети на ліфт → розбір → далеко" },
    { key: "ліфт_палети_розбір_коротко", title: "🛗 Палети на ліфт → розбір → коротко" },
    { key: "ліфт_палети_тягнути_далеко", title: "🛗 Палети на ліфт → тягнути далеко" },
    { key: "ліфт_палети_тягнути_коротко", title: "🛗 Палети на ліфт → тягнути коротко" },
    { key: "ліфт_палети_рокля", title: "🛗 Палети на ліфт → рокля" },
    { key: "ліфт_замалий", title: "🛗📦 Ліфт замалий" },
    { key: "немає_вантажного_ліфта", title: "🛗🚫 Немає вантажного ліфта" },
    { key: "підсобка_кінець_коридору", title: "🚶 Підсобка в кінці коридору" },
    { key: "підсобка_2й_поверх_окремо", title: "🏢 Підсобка на 2 поверсі" },
    { key: "підсобка_далеко_2й_поверх", title: "🏢 Підсобка далеко + 2й поверх" },
    { key: "розрив_сходи", title: "📦+📈 Розрив + сходи" },
    { key: "вузький_двір_підвал", title: "🚫+⬇️ Вузький двір + підвал" },
    { key: "ліфт_комбо", title: "🏢+🛗+🚶 2й поверх+ліфт+далеко" }
  ];

  // Прості дані - тільки числа
  let shops = {
    "білі": { "легко": [], "потно": [], "тяжко": [] },
    "сірі": { "легко": [], "потно": [], "тяжко": [] },
    "чорні": { "легко": [], "потно": [], "тяжко": [] }
  };
  let shopReasons = {};
  let config = { apiKey: "", binId: "" };
  let selectedReason = "";

  function saveToLocal() {
    localStorage.setItem("shops", JSON.stringify(shops));
    localStorage.setItem("reasons", JSON.stringify(shopReasons));
  }
  
  function loadFromLocal() {
    const savedShops = localStorage.getItem("shops");
    if (savedShops) {
      try {
        shops = JSON.parse(savedShops);
      } catch(e) {}
    }
    const savedReasons = localStorage.getItem("reasons");
    if (savedReasons) {
      try {
        shopReasons = JSON.parse(savedReasons);
      } catch(e) {}
    }
    renderGroups();
  }
  
  function loadConfig() {
    const saved = localStorage.getItem("sync_cfg");
    if (saved) {
      try {
        config = JSON.parse(saved);
        document.getElementById("apiKeyInput").value = config.apiKey || "";
        document.getElementById("binIdInput").value = config.binId || "";
      } catch(e) {}
    }
  }
  
  function saveConfig() {
    config.apiKey = document.getElementById("apiKeyInput").value.trim();
    config.binId = document.getElementById("binIdInput").value.trim();
    localStorage.setItem("sync_cfg", JSON.stringify(config));
    document.getElementById("syncStatus").innerHTML = "✅ Збережено!";
  }
  
  async function download() {
    if (!config.apiKey || !config.binId) {
      document.getElementById("syncStatus").innerHTML = "⚠️ Збережіть ключі!";
      return;
    }
    document.getElementById("syncStatus").innerHTML = "📥 Завантаження...";
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${config.binId}/latest`, {
        headers: { "X-Master-Key": config.apiKey }
      });
      if (res.ok) {
        const data = await res.json();
        if (data.record && data.record.shops) {
          shops = data.record.shops;
          shopReasons = data.record.reasons || {};
          saveToLocal();
          renderGroups();
          document.getElementById("syncStatus").innerHTML = "✅ Завантажено!";
        } else {
          document.getElementById("syncStatus").innerHTML = "⚠️ Хмара порожня";
        }
      } else {
        document.getElementById("syncStatus").innerHTML = "❌ Помилка!";
      }
    } catch(e) {
      document.getElementById("syncStatus").innerHTML = "❌ Немає інтернету";
    }
  }
  
  async function upload() {
    if (!config.apiKey || !config.binId) {
      document.getElementById("syncStatus").innerHTML = "⚠️ Збережіть ключі!";
      return;
    }
    document.getElementById("syncStatus").innerHTML = "📤 Відправка...";
    try {
      const data = { shops: shops, reasons: shopReasons };
      const res = await fetch(`https://api.jsonbin.io/v3/b/${config.binId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": config.apiKey
        },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        document.getElementById("syncStatus").innerHTML = "✅ Відправлено!";
      } else {
        document.getElementById("syncStatus").innerHTML = "❌ Помилка!";
      }
    } catch(e) {
      document.getElementById("syncStatus").innerHTML = "❌ Немає інтернету";
    }
  }
  
  function addShop(num, color, comp, reason) {
    const n = Number(num);
    if (isNaN(n)) return;
    for (let c of ["білі","сірі","чорні"]) {
      for (let cp of ["легко","потно","тяжко"]) {
        shops[c][cp] = shops[c][cp].filter(i => i !== n);
      }
    }
    shops[color][comp].push(n);
    shops[color][comp].sort((a,b)=>a-b);
    if (reason) shopReasons[n] = reason;
    saveToLocal();
    renderGroups();
    document.getElementById("syncStatus").innerHTML = "✅ Збережено! Натисніть 'Відправити'";
  }
  
  function removeShop(n, color, comp) {
    shops[color][comp] = shops[color][comp].filter(i => i !== n);
    delete shopReasons[n];
    saveToLocal();
    renderGroups();
    document.getElementById("syncStatus").innerHTML = "✅ Видалено! Натисніть 'Відправити'";
  }
  
  function changeShop(shop, oldColor, oldComp, newColor, newComp) {
    const reason = shopReasons[shop] || "";
    shops[oldColor][oldComp] = shops[oldColor][oldComp].filter(i => i !== shop);
    shops[newColor][newComp].push(shop);
    shops[newColor][newComp].sort((a,b)=>a-b);
    saveToLocal();
    renderGroups();
    document.getElementById("syncStatus").innerHTML = "✅ Змінено! Натисніть 'Відправити'";
  }
  
  function getReasonText(key) {
    const found = fullReasonsList.find(r => r.key === key);
    return found ? found.title : "";
  }
  
  function renderGroups() {
    const container = document.getElementById("groupsGrid");
    if (!container) return;
    let html = "";
    const groups = ["білі","сірі","чорні"];
    const titles = { "білі":"⚪ БІЛІ","сірі":"⚫ СІРІ","чорні":"⬛ ЧОРНІ" };
    const headerBg = { "білі":"white-header","сірі":"gray-header","чорні":"black-header" };
    const comps = ["легко","потно","тяжко"];
    const icons = { "легко":"🟢","потно":"💦","тяжко":"⛰️" };
    const names = { "легко":"Легко","потно":"Потно","тяжко":"Тяжко" };
    
    for (let g of groups) {
      html += `<div class="group-col"><div class="group-header ${headerBg[g]}">${titles[g]}</div>`;
      for (let cp of comps) {
        let items = shops[g][cp] || [];
        html += `<div class="subgroup"><div class="subgroup-title"><span>${icons[cp]} ${names[cp]}</span><span>${items.length} од.</span></div><div class="shop-list">`;
        if (items.length === 0) {
          html += `<div class="empty-msg">✖️ немає</div>`;
        } else {
          for (let shop of items) {
            let reason = getReasonText(shopReasons[shop]);
            let border = cp==="легко"?"#48a848":(cp==="потно"?"#e98a2e":"#bc3f31");
            html += `<div class="shop-item" style="border-left-color:${border}">
              <span class="shop-number">${shop}</span>
              ${reason ? `<span class="shop-reason">📌 ${reason}</span>` : ''}
              <select class="edit-select" data-shop="${shop}" data-old-color="${g}" data-old-comp="${cp}">
                <option value="" disabled>🔄</option>
                <option value="білі_легко">⚪ легко</option>
                <option value="білі_потно">⚪ потно</option>
                <option value="білі_тяжко">⚪ тяжко</option>
                <option value="сірі_легко">⚫ легко</option>
                <option value="сірі_потно">⚫ потно</option>
                <option value="сірі_тяжко">⚫ тяжко</option>
                <option value="чорні_легко">⬛ легко</option>
                <option value="чорні_потно">⬛ потно</option>
                <option value="чорні_тяжко">⬛ тяжко</option>
              </select>
              <button class="delete-shop" data-shop="${shop}" data-color="${g}" data-comp="${cp}">✖</button>
            </div>`;
          }
        }
        html += `</div></div>`;
      }
      html += `</div>`;
    }
    container.innerHTML = html;
    
    document.querySelectorAll('.delete-shop').forEach(btn => {
      btn.onclick = () => {
        if (confirm(`Видалити?`)) {
          removeShop(parseInt(btn.dataset.shop), btn.dataset.color, btn.dataset.comp);
        }
      };
    });
    document.querySelectorAll('.edit-select').forEach(sel => {
      sel.onchange = () => {
        let shop = parseInt(sel.dataset.shop);
        let oldColor = sel.dataset.oldColor;
        let oldComp = sel.dataset.oldComp;
        let val = sel.value;
        if (!val) return;
        let [newColor, newComp] = val.split('_');
        changeShop(shop, oldColor, oldComp, newColor, newComp);
      };
    });
  }
  
  function checkShop() {
    let v = document.getElementById("checkShopInput").value.trim();
    if (!v) { document.getElementById("checkResult").innerHTML = "⚠️ Введіть номер"; return; }
    let num = Number(v);
    if (isNaN(num)) { document.getElementById("checkResult").innerHTML = "❌ Помилка"; return; }
    let found = null;
    for (let c of ["білі","сірі","чорні"]) {
      for (let cp of ["легко","потно","тяжко"]) {
        if (shops[c][cp].includes(num)) found = { color: c, comp: cp };
      }
    }
    if (found) {
      let reason = getReasonText(shopReasons[num]);
      document.getElementById("checkResult").innerHTML = `<strong>🏪 Магазин ${num}</strong><br>📌 ${found.color}, ${found.comp}${reason ? `, ${reason}` : ''}`;
    } else {
      document.getElementById("checkResult").innerHTML = `<strong>🏪 Магазин ${num}</strong><br>⚠️ Немає даних`;
    }
  }
  
  function addFromMobile() {
    let num = document.getElementById("newShopNumber").value.trim();
    if (!num) { alert("Введіть номер"); return; }
    addShop(Number(num), document.getElementById("newShopColor").value, document.getElementById("newShopComplexity").value, selectedReason);
    document.getElementById("newShopNumber").value = "";
  }
  
  function initReasonButtons() {
    const container = document.getElementById("reasonButtons");
    if (!container) return;
    container.innerHTML = "";
    fullReasonsList.forEach(reason => {
      const btn = document.createElement("div");
      btn.className = "reason-btn";
      btn.textContent = reason.title;
      btn.dataset.reason = reason.key;
      btn.onclick = () => {
        document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedReason = reason.key;
      };
      container.appendChild(btn);
    });
  }
  
  function initDemo() {
    let has = false;
    for (let c of ["білі","сірі","чорні"]) {
      for (let cp of ["легко","потно","тяжко"]) {
        if (shops[c][cp].length) has = true;
      }
    }
    if (!has) {
      addShop(708, "чорні", "тяжко", "другий_поверх_руками");
      addShop(39, "чорні", "легко", "рокля_підсобка");
      addShop(3039, "білі", "легко", "рокля_підсобка");
    }
  }
  
  loadFromLocal();
  loadConfig();
  initDemo();
  initReasonButtons();
  
  document.getElementById("saveConfigBtn").onclick = saveConfig;
  document.getElementById("syncDownBtn").onclick = download;
  document.getElementById("syncUpBtn").onclick = upload;
  document.getElementById("checkShopBtn").onclick = checkShop;
  document.getElementById("addShopBtn").onclick = addFromMobile;
</script>
</body>
</html>
