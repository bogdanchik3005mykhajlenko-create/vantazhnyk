<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CYBER DRIVER">
  <title>CYBER DRIVER · Вантажник 3000</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Анімований кіберпанк фон */
    body {
      background: radial-gradient(ellipse at 20% 30%, #0a0f1e 0%, #03060c 100%);
      font-family: 'Share Tech Mono', 'Courier New', 'Fira Code', monospace;
      padding: 18px 14px;
      min-height: 100vh;
      color: #0ff;
      position: relative;
      overflow-x: hidden;
    }

    /* Динамічні сітки на фоні */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Анімований неоновий промінь */
    body::after {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.08) 0%, transparent 70%);
      animation: rotateBeam 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes rotateBeam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Глітч-ефект для заголовків */
    @keyframes glitch {
      0%, 100% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
      33% { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
      66% { text-shadow: 0px 2px #ff00ff, 0px -2px #00ffff; }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* КІБЕРПАНК ХЕДЕР */
    .cyber-header {
      background: rgba(0, 20, 30, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid #0ff;
      border-radius: 32px;
      padding: 24px 20px;
      margin-bottom: 28px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .cyber-header::before {
      content: "⟁ ⧉ ⟁";
      position: absolute;
      bottom: 8px;
      right: 20px;
      font-size: 0.7rem;
      opacity: 0.3;
      letter-spacing: 4px;
    }

    .cyber-header h1 {
      font-size: 1.8rem;
      letter-spacing: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      animation: glitch 3s infinite;
    }

    .cyber-header h1 small {
      background: linear-gradient(135deg, #ff00ff, #00ffff);
      color: #000;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .cyber-header p {
      color: #0cf;
      font-size: 0.75rem;
      margin-top: 12px;
      letter-spacing: 1px;
      border-left: 2px solid #f0f;
      padding-left: 12px;
    }

    /* ЗАГАЛЬНІ КАРТКИ */
    .cyber-card, .sync-panel {
      background: rgba(0, 20, 30, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid #0cf;
      border-radius: 28px;
      padding: 18px 20px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 255, 255, 0.1);
    }

    .cyber-card:hover, .sync-panel:hover {
      border-color: #f0f;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
    }

    .sync-title, h3 {
      font-size: 0.75rem;
      color: #f0f;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 14px;
      display: inline-block;
      border-bottom: 1px solid #f0f;
      padding-bottom: 4px;
    }

    /* ПОЛЯ ВВОДУ ТА КНОПКИ */
    input, select {
      background: #000000cc;
      border: 1px solid #0ff;
      padding: 12px 16px;
      border-radius: 48px;
      color: #0ff;
      font-family: monospace;
      font-size: 0.85rem;
      transition: all 0.1s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #f0f;
      box-shadow: 0 0 8px #f0f;
    }

    button {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid #0ff;
      padding: 10px 20px;
      border-radius: 48px;
      color: #0ff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.08s linear;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:active {
      transform: scale(0.96);
      background: #0ff;
      color: #000;
      box-shadow: 0 0 15px #0ff;
    }

    .sync-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
    }

    /* СІТКА 3×3 */
    .cyber-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 28px 0;
    }

    .grid-card {
      background: linear-gradient(145deg, #061218, #010508);
      border: 1px solid #0cf;
      border-radius: 24px;
      text-align: center;
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
    }

    .grid-card:active {
      transform: scale(0.96);
      border-color: #f0f;
      box-shadow: 0 0 20px #f0f;
    }

    .grid-count {
      font-size: 2rem;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
      margin: 6px 0;
    }

    /* БЛОК ПРИЧИН */
    .reason-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 130px;
      overflow-y: auto;
      margin: 12px 0;
      padding: 4px;
    }

    .reason-btn {
      background: #000000aa;
      border: 1px solid #0ff;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.05s linear;
    }

    .reason-btn.selected {
      background: #0ff;
      color: #000;
      border-color: #f0f;
    }

    .reason-btn:active {
      transform: scale(0.95);
    }

    /* МОДАЛЬНЕ ВІКНО */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-cyber {
      background: #0a0f1e;
      border: 2px solid #0ff;
      border-radius: 40px;
      width: 90%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
    }

    .modal-header {
      background: linear-gradient(90deg, #0ff, #f0f);
      color: #000;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .shop-item {
      background: #061218;
      border: 1px solid #0cf;
      border-radius: 60px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .modal-close {
      background: #2c2c44;
      margin: 16px;
      padding: 12px;
      border-radius: 40px;
    }

    .delete-shop {
      background: #ff005522;
      border: 1px solid #f0f;
      padding: 4px 12px;
      border-radius: 30px;
    }

    /* статуси та футер */
    .sync-status {
      margin-top: 12px;
      font-size: 0.7rem;
      font-family: monospace;
      background: #00000066;
      padding: 6px 12px;
      border-radius: 20px;
    }

    footer {
      text-align: center;
      font-size: 0.6rem;
      opacity: 0.6;
      margin: 30px 0 10px;
      letter-spacing: 1px;
    }

    /* адаптив */
    @media (max-width: 600px) {
      .cyber-grid { gap: 10px; }
      .grid-card { padding: 12px 4px; }
      .grid-count { font-size: 1.5rem; }
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #010508;
    }
    ::-webkit-scrollbar-thumb {
      background: #0ff;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="cyber-header">
    <h1>⟁ CYBER DRIVER 3000 🚛 <small>v.∞</small></h1>
    <p>⚡ нейросинхронізація · квантовий розподіл магазинів · другий поверх | підвал | пандус</p>
  </div>

  <div class="sync-panel">
    <div class="sync-title">🌀 ХМАРНИЙ ІНТЕРФЕЙС</div>
    <div class="sync-row">
      <input type="text" id="apiKeyInput" placeholder="[ API-ключ ]">
      <input type="text" id="binIdInput" placeholder="[ Bin ID ]">
      <button id="saveConfigBtn">💾 ЗАПИСАТИ</button>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <button id="syncDownBtn">⬇️ ЗАВАНТАЖИТИ</button>
      <button id="syncUpBtn">⬆️ ВІДПРАВИТИ</button>
      <button id="clearStorageBtn" style="border-color:#f0f; color:#f0f;">⚠️ СТЕРТИ ВСЕ</button>
    </div>
    <div class="sync-status" id="syncStatus">⚙️ готовий до підключення</div>
  </div>

  <div class="cyber-card">
    <h3>🔍 СКАНЕР МАГАЗИНІВ</h3>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <input type="number" id="checkShopInput" placeholder="номер об'єкта">
      <button id="checkShopBtn">РОЗПІЗНАТИ</button>
    </div>
    <div id="checkResult" style="margin-top: 12px; padding: 8px; background: #00000055; border-radius: 20px;"></div>
  </div>

  <div class="cyber-card">
    <h3>➕ ДОДАТИ МАГАЗИН</h3>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <input type="number" id="newShopNumber" placeholder="номер">
      <select id="newShopColor"><option value="білі">⚪ БІЛІ</option><option value="сірі">⚫ СІРІ</option><option value="чорні">⬛ ЧОРНІ</option></select>
      <select id="newShopComplexity"><option value="легко">🟢 ЛЕГКИЙ РІВЕНЬ</option><option value="потно">💦 ПОТНО</option><option value="тяжко">⛰️ ТЯЖКИЙ РЕЖИМ</option></select>
    </div>
    <div class="reason-buttons" id="reasonButtons"></div>
    <button id="addShopBtn" style="width:100%; margin-top: 12px;">✅ АКТИВУВАТИ</button>
  </div>

  <div class="cyber-grid" id="cyberGrid"></div>
  <footer>🛸 нейромережа локальна · всі дані захищені квантовим шифруванням (localStorage)</footer>
</div>

<script>
  // СПИСОК ПРИЧИН (кіберпанк)
  const fullReasons = [
    { key: "рокля_підсобка", title: "🛸 Рокля до підсобки" },
    { key: "рокля_далеко", title: "🚀 Рокля + далеко" },
    { key: "рокля_гора", title: "⛰️ Рокля + гора" },
    { key: "розрив_перед_весь", title: "📡 Розрив перед → весь" },
    { key: "розрив_перед_коротко", title: "⚡ Розрив перед → коротко" },
    { key: "розрив_всередині_весь", title: "🏪 Розрив всередині → весь" },
    { key: "другий_поверх_руками", title: "🏢 2й поверх + кіберруки" },
    { key: "підвал_один", title: "⬇️ Підвал 1 рівень" },
    { key: "ліфт_палети", title: "🛗 Квантовий ліфт + палети" },
    { key: "вузький_двір", title: "🚫 Вузький двір" },
    { key: "немає_пандуса", title: "🚫 Пандус відсутній" },
    { key: "ліфт_розбір", title: "🛗 Ліфт + розбір на місці" }
  ];

  let shops = {
    "білі": { "легко": [], "потно": [], "тяжко": [] },
    "сірі": { "легко": [], "потно": [], "тяжко": [] },
    "чорні": { "легко": [], "потно": [], "тяжко": [] }
  };
  let shopReasons = {};
  let config = { apiKey: "", binId: "" };
  let selectedReason = "";

  // Збереження / завантаження
  function saveLocal() { localStorage.setItem("shops", JSON.stringify(shops)); localStorage.setItem("reasons", JSON.stringify(shopReasons)); }
  function loadLocal() {
    const s = localStorage.getItem("shops"); if(s) try { shops = JSON.parse(s); } catch(e) {}
    const r = localStorage.getItem("reasons"); if(r) try { shopReasons = JSON.parse(r); } catch(e) {}
    renderGrid();
  }
  function loadConfig() { const s = localStorage.getItem("sync_cfg"); if(s) try { config = JSON.parse(s); document.getElementById("apiKeyInput").value = config.apiKey || ""; document.getElementById("binIdInput").value = config.binId || ""; } catch(e) {} }
  function saveConfig() { config.apiKey = document.getElementById("apiKeyInput").value.trim(); config.binId = document.getElementById("binIdInput").value.trim(); localStorage.setItem("sync_cfg", JSON.stringify(config)); document.getElementById("syncStatus").innerHTML = "✅ конфігурацію збережено"; }

  async function download() { if(!config.apiKey||!config.binId) { document.getElementById("syncStatus").innerHTML="⚠️ збережіть ключі"; return; } document.getElementById("syncStatus").innerHTML="📡 завантаження..."; try{ const res=await fetch(`https://api.jsonbin.io/v3/b/${config.binId}/latest`,{headers:{"X-Master-Key":config.apiKey}}); if(res.ok){ const data=await res.json(); if(data.record?.shops){ shops=data.record.shops; shopReasons=data.record.reasons||{}; saveLocal(); renderGrid(); document.getElementById("syncStatus").innerHTML="✅ синхронізація завершена"; } else document.getElementById("syncStatus").innerHTML="⚠️ хмара порожня"; } else document.getElementById("syncStatus").innerHTML="❌ помилка з'єднання"; } catch(e){ document.getElementById("syncStatus").innerHTML="❌ offline"; } }
  async function upload() { if(!config.apiKey||!config.binId) { document.getElementById("syncStatus").innerHTML="⚠️ збережіть ключі"; return; } document.getElementById("syncStatus").innerHTML="📡 відправка..."; try{ const res=await fetch(`https://api.jsonbin.io/v3/b/${config.binId}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":config.apiKey},body:JSON.stringify({shops, reasons:shopReasons})}); if(res.ok){ document.getElementById("syncStatus").innerHTML="✅ відправлено в хмару"; } else document.getElementById("syncStatus").innerHTML="❌ помилка відправки"; } catch(e){ document.getElementById("syncStatus").innerHTML="❌ offline"; } }

  function addShop(num, color, comp, reason) {
    const n = Number(num); if(isNaN(n)) return;
    for(let c of ["білі","сірі","чорні"]) for(let cp of ["легко","потно","тяжко"]) shops[c][cp] = shops[c][cp].filter(i=>i!==n);
    shops[color][comp].push(n); shops[color][comp].sort((a,b)=>a-b);
    if(reason) shopReasons[n] = reason;
    saveLocal(); renderGrid();
  }
  function removeShop(n, color, comp) { shops[color][comp] = shops[color][comp].filter(i=>i!==n); delete shopReasons[n]; saveLocal(); renderGrid(); }
  function getReason(key) { const f = fullReasons.find(r=>r.key===key); return f ? f.title : ""; }

  function openModal(color, comp) {
    const list = shops[color][comp];
    const colorMap={"білі":"⚪ БІЛІ","сірі":"⚫ СІРІ","чорні":"⬛ ЧОРНІ"};
    const compMap={"легко":"🟢 ЛЕГКИЙ","потно":"💦 ПОТНО","тяжко":"⛰️ ТЯЖКИЙ"};
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    let html = `<div class="modal-cyber"><div class="modal-header">${colorMap[color]} // ${compMap[comp]}</div><div class="modal-list">`;
    if(list.length===0) html+=`<div style="text-align:center; padding:20px;">⛔ немає об'єктів</div>`;
    else list.forEach(shop=>{ html+=`<div class="shop-item"><span>🏪 ${shop}</span><span style="font-size:0.7rem;">${getReason(shopReasons[shop])||"—"}</span><button class="delete-shop" data-shop="${shop}" data-color="${color}" data-comp="${comp}">✖ СТЕРТИ</button></div>`; });
    html+=`</div><button class="modal-close" id="closeModal">ЗАКРИТИ ТЕРМІНАЛ</button></div>`;
    ov.innerHTML = html;
    document.body.appendChild(ov);
    ov.querySelectorAll('.delete-shop').forEach(btn=>{ btn.onclick=()=>{ const s=parseInt(btn.dataset.shop); if(confirm(`видалити магазин ${s}?`)){ removeShop(s,btn.dataset.color,btn.dataset.comp); ov.remove(); openModal(color,comp); } }; });
    ov.querySelector('#closeModal').onclick=()=>ov.remove();
    ov.onclick=(e)=>{if(e.target===ov) ov.remove();};
  }

  function renderGrid() {
    const grid = document.getElementById("cyberGrid"); if(!grid) return;
    let html="";
    for(let c of ["білі","сірі","чорні"]){
      for(let cp of ["легко","потно","тяжко"]){
        const cnt = shops[c][cp].length;
        const colSym = c==="білі"?"⚪":(c==="сірі"?"⚫":"⬛");
        html+=`<div class="grid-card" data-color="${c}" data-comp="${cp}"><div>${colSym} ${c.toUpperCase()}</div><div style="font-size:0.7rem;">${cp === "легко"?"🟢 ЛЕГКО":(cp==="потно"?"💦 ПОТНО":"⛰️ ТЯЖКО")}</div><div class="grid-count">${cnt}</div></div>`;
      }
    }
    grid.innerHTML=html;
    document.querySelectorAll('.grid-card').forEach(card=>{ card.onclick=()=>openModal(card.dataset.color, card.dataset.comp); });
  }

  function checkShop() {
    let v = document.getElementById("checkShopInput").value.trim();
    if(!v){ document.getElementById("checkResult").innerHTML="⚠️ введіть номер"; return; }
    let num = Number(v); if(isNaN(num)){ document.getElementById("checkResult").innerHTML="❌ помилка"; return; }
    let found=null;
    for(let c of ["білі","сірі","чорні"]) for(let cp of ["легко","потно","тяжко"]) if(shops[c][cp].includes(num)) found={color:c,comp:cp};
    if(found) document.getElementById("checkResult").innerHTML=`🏪 МАГАЗИН ${num}<br>📌 ${found.color} · ${found.comp}<br>🔧 ${getReason(shopReasons[num])||"без додаткових параметрів"}`;
    else document.getElementById("checkResult").innerHTML=`🏪 ${num}<br>⚠️ об'єкт не знайдено`;
  }

  function addUI() { let num = document.getElementById("newShopNumber").value.trim(); if(!num){ alert("введіть номер"); return; } addShop(Number(num), document.getElementById("newShopColor").value, document.getElementById("newShopComplexity").value, selectedReason); document.getElementById("newShopNumber").value=""; }

  function initReasons() { const cont=document.getElementById("reasonButtons"); if(!cont) return; cont.innerHTML=""; fullReasons.forEach(r=>{ const btn=document.createElement("div"); btn.className="reason-btn"; btn.textContent=r.title; btn.dataset.reason=r.key; btn.onclick=()=>{ document.querySelectorAll('.reason-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); selectedReason=r.key; }; cont.appendChild(btn); }); }

  function initDemo() { let has=false; for(let c of ["білі","сірі","чорні"]) for(let cp of ["легко","потно","тяжко"]) if(shops[c][cp].length) has=true; if(!has){ addShop(708,"чорні","тяжко","другий_поверх_руками"); addShop(39,"чорні","легко","рокля_підсобка"); addShop(3039,"білі","легко","рокля_підсобка"); addShop(642,"білі","потно","розрив_перед_весь"); addShop(2719,"білі","легко","рокля_підсобка"); } }

  function clearAllData() { if(confirm("⚠️ ВИДАЛИТИ ВСІ ДАНІ? Відновити неможливо!")){ shops={"білі":{"легко":[],"потно":[],"тяжко":[]},"сірі":{"легко":[],"потно":[],"тяжко":[]},"чорні":{"легко":[],"потно":[],"тяжко":[]}}; shopReasons={}; saveLocal(); renderGrid(); document.getElementById("syncStatus").innerHTML="⚠️ всі дані стерто"; } }

  loadLocal(); loadConfig(); initDemo(); initReasons(); renderGrid();
  document.getElementById("saveConfigBtn").onclick = saveConfig;
  document.getElementById("syncDownBtn").onclick = download;
  document.getElementById("syncUpBtn").onclick = upload;
  document.getElementById("checkShopBtn").onclick = checkShop;
  document.getElementById("addShopBtn").onclick = addUI;
  document.getElementById("clearStorageBtn").onclick = clearAllData;
</script>
</body>
</html>
