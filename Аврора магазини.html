<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CYBER DRIVER">
  <title>CYBER DRIVER · Вантажник 3000</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
      font-family: 'Share Tech Mono', 'Courier New', 'Fira Code', monospace;
      padding: 18px 14px;
      min-height: 100vh;
      color: #0ff;
      text-shadow: 0 0 2px #0ff;
    }

    /* неоновий глітч-ефект */
    @keyframes glitch {
      0% { text-shadow: -2px 0 #ff00c1, 2px 0 #00fff9; }
      50% { text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; }
      100% { text-shadow: -2px 0 #ff00c1, 2px 0 #00fff9; }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* head з неоном */
    .cyber-header {
      background: rgba(0, 255, 255, 0.05);
      border: 1px solid #0ff;
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 28px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 12px #0ff, inset 0 0 6px #0ff;
      transition: all 0.2s;
    }

    .cyber-header h1 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .cyber-header h1 small {
      font-size: 0.65rem;
      background: #0ff10f;
      color: #000;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: bold;
      text-shadow: none;
      font-family: monospace;
    }

    .cyber-header p {
      font-size: 0.75rem;
      color: #0cf;
      margin-top: 12px;
      border-left: 3px solid #0ff;
      padding-left: 12px;
    }

    /* Панель синхронізації – термінал */
    .sync-panel {
      background: #0a0f1ccc;
      border: 1px solid #0ff;
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .sync-title {
      font-weight: bold;
      font-size: 0.8rem;
      color: #f0f;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .sync-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sync-row input {
      flex: 2;
      background: #000000aa;
      border: 1px solid #0ff;
      padding: 12px 16px;
      border-radius: 48px;
      color: #0ff;
      font-family: monospace;
      font-size: 0.8rem;
      outline: none;
    }

    .sync-row input:focus {
      border-color: #f0f;
      box-shadow: 0 0 8px #f0f;
    }

    .btn-sm {
      padding: 10px 18px;
      border-radius: 40px;
      border: none;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.1s;
    }

    .btn-save { background: #2c3e66; color: #0ff; border: 1px solid #0ff; }
    .btn-down { background: #0b4d2e; color: #0f0; border: 1px solid #0f0; }
    .btn-up { background: #b45a1c; color: #ffaa33; border: 1px solid #ffaa33; }

    .sync-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sync-status {
      font-size: 0.7rem;
      color: #0ff;
      margin-top: 12px;
      font-family: monospace;
    }

    /* скляні картки дій */
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    .cyber-card {
      background: rgba(0, 255, 255, 0.03);
      border: 1px solid #0cf;
      border-radius: 28px;
      padding: 20px;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .cyber-card h3 {
      font-size: 1rem;
      color: #0ff;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .check-input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .check-input-group input {
      flex: 2;
      background: #000000aa;
      border: 1px solid #0ff;
      border-radius: 48px;
      padding: 14px;
      color: #0ff;
      font-size: 1rem;
      font-family: monospace;
    }

    button {
      background: #0ff22a11;
      border: 1px solid #0ff;
      padding: 12px 22px;
      border-radius: 48px;
      font-weight: bold;
      color: #0ff;
      font-family: monospace;
      cursor: pointer;
      transition: 0.1s;
    }

    button:active {
      transform: scale(0.96);
      background: #0ff;
      color: #000;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .select-group input, .select-group select {
      background: #000000aa;
      border: 1px solid #0ff;
      border-radius: 48px;
      padding: 14px;
      color: #0ff;
      font-family: monospace;
      width: 100%;
    }

    .reason-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding: 4px;
      border-top: 1px dashed #0ff;
      margin-top: 8px;
      padding-top: 12px;
    }

    .reason-btn {
      background: #00000088;
      border: 1px solid #0ff;
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-family: monospace;
      cursor: pointer;
      color: #0ff;
    }

    .reason-btn.selected {
      background: #0ff;
      color: #000;
      border-color: #f0f;
      box-shadow: 0 0 6px #f0f;
    }

    /* сітка 3x3 — кіберпанк стиль */
    .cyber-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 30px 0 20px;
    }

    .grid-card {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #0ff;
      border-radius: 20px;
      text-align: center;
      padding: 16px 6px;
      cursor: pointer;
      transition: 0.1s;
      backdrop-filter: blur(2px);
    }

    .grid-card:active {
      transform: scale(0.96);
      border-color: #f0f;
      box-shadow: 0 0 12px #f0f;
    }

    .grid-color {
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .grid-comp {
      font-size: 0.7rem;
      margin: 6px 0;
      color: #0cf;
    }

    .grid-count {
      font-size: 1.8rem;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 4px #0ff;
    }

    /* модальне вікно кібер */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-cyber {
      background: #0a0f1e;
      border: 2px solid #0ff;
      border-radius: 32px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px #0ff;
    }

    .modal-cyber .modal-header {
      background: #0ff11a;
      color: #000;
      padding: 18px;
      font-weight: bold;
      font-size: 1.3rem;
      text-align: center;
      font-family: monospace;
    }

    .modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .shop-item-cyber {
      background: #000000aa;
      border: 1px solid #0ff;
      border-radius: 60px;
      padding: 8px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shop-number {
      background: #0ff;
      color: #000;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: bold;
    }

    .shop-reason {
      font-size: 0.7rem;
      color: #0cf;
    }

    .delete-shop {
      background: #ff005511;
      border: 1px solid #f0f;
      color: #f0f;
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
    }

    .modal-close {
      background: #6c757d;
      margin: 12px 20px 20px;
      padding: 12px;
      border-radius: 60px;
      border: none;
      color: white;
    }

    .empty-msg {
      text-align: center;
      color: #0ff;
      opacity: 0.6;
      padding: 32px;
    }

    footer {
      font-size: 0.6rem;
      text-align: center;
      color: #0cf;
      margin: 20px 0 10px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="cyber-header">
    <h1>⚡ CYBER DRIVER 🚛 <small>v.3000</small></h1>
    <p>🔷 [[ другий поверх | підвал | пандус ]] 🔷 синхронізація через нейромережу</p>
  </div>

  <div class="sync-panel">
    <div class="sync-title">🛜 СИНХРОНІЗАЦІЯ</div>
    <div class="sync-row">
      <input type="text" id="apiKeyInput" placeholder="API ключ">
      <input type="text" id="binIdInput" placeholder="ID Bin">
      <button id="saveConfigBtn" class="btn-sm btn-save">💾 Зберегти</button>
    </div>
    <div class="sync-buttons">
      <button id="syncDownBtn" class="btn-sm btn-down">📥 Завантажити</button>
      <button id="syncUpBtn" class="btn-sm btn-up">📤 Відправити</button>
    </div>
    <div class="sync-status" id="syncStatus">⚙️ введіть ключі доступу</div>
  </div>

  <div class="action-panel">
    <div class="cyber-card">
      <h3>🔍 СКАНУВАТИ МАГАЗИН</h3>
      <div class="check-input-group">
        <input type="number" id="checkShopInput" placeholder="номер">
        <button id="checkShopBtn">ПІДКАЗКА</button>
      </div>
      <div id="checkResult" style="margin-top: 12px;"></div>
    </div>

    <div class="cyber-card">
      <h3>➕ ВСТАНОВИТИ НОВИЙ ОБ'ЄКТ</h3>
      <div class="select-group">
        <input type="number" id="newShopNumber" placeholder="номер">
        <select id="newShopColor">
          <option value="білі">⚪ Білі</option>
          <option value="сірі">⚫ Сірі</option>
          <option value="чорні">⬛ Чорні</option>
        </select>
        <select id="newShopComplexity">
          <option value="легко">🟢 Легко</option>
          <option value="потно">💦 Потно</option>
          <option value="тяжко">⛰️ Тяжко</option>
        </select>
      </div>
      <div class="reason-buttons" id="reasonButtons"></div>
      <button id="addShopBtn" style="width:100%; margin-top: 14px;">✅ ДОДАТИ</button>
    </div>
  </div>

  <div class="cyber-grid" id="cyberGrid"></div>
  <footer>💠 нейромережевий протокол синхронізації – всі дані локально</footer>
</div>

<script>
  const fullReasonsList = [
    { key: "рокля_підсобка", title: "🛒 Рокля до підсобки" },
    { key: "рокля_далеко", title: "🚶 Рокля + далеко" },
    { key: "рокля_гора", title: "⛰️ Рокля + гора" },
    { key: "розрив_перед_весь", title: "📦 Розрив перед → весь магазин" },
    { key: "розрив_перед_коротко", title: "📦 Розрив перед → коротко" },
    { key: "розрив_всередині_весь", title: "🏪 Розрив всередині → весь магазин" },
    { key: "розрив_всередині_коротко", title: "🏪 Розрив всередині → коротко" },
    { key: "другий_поверх_руками", title: "🏢 2й поверх → руками" },
    { key: "підвал_один", title: "⬇️ Підвал 1 проліт" },
    { key: "підвал_глибокий", title: "⬇️⬇️ Глибокий підвал" },
    { key: "ліфт_палети_тягнути", title: "🛗 Палети на ліфт → тягнути" },
    { key: "ліфт_палети_рокля", title: "🛗 Палети на ліфт → рокля" },
    { key: "вузький_двір", title: "🚫 Вузький двір" },
    { key: "немає_пандуса", title: "🚫 Немає пандуса" },
    { key: "парковка_далеко", title: "🚶 Парковка далеко" },
    { key: "сходи_вверх", title: "📈 Сходи вверх" },
    { key: "ліфт_замалий", title: "🛗 Ліфт замалий" }
  ];

  let shops = {
    "білі": { "легко": [], "потно": [], "тяжко": [] },
    "сірі": { "легко": [], "потно": [], "тяжко": [] },
    "чорні": { "легко": [], "потно": [], "тяжко": [] }
  };
  let shopReasons = {};
  let config = { apiKey: "", binId: "" };
  let selectedReason = "";
  let lastSnapshot = new Set();

  function getAllSet() {
    const set = new Set();
    for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) for (let n of shops[c][cp]) set.add(n);
    return set;
  }
  function updateSnapshot() { lastSnapshot = getAllSet(); }
  function getDeleted() { const curr = getAllSet(); const d = []; for (let s of lastSnapshot) if (!curr.has(s)) d.push(s); return d; }
  function hasLocalChanges() { const curr = getAllSet(); if (curr.size !== lastSnapshot.size) return true; for (let s of curr) if (!lastSnapshot.has(s)) return true; return false; }

  function saveLocal() { localStorage.setItem("shops", JSON.stringify(shops)); localStorage.setItem("reasons", JSON.stringify(shopReasons)); }
  function loadLocal() {
    const s = localStorage.getItem("shops"); if(s) try { shops = JSON.parse(s); } catch(e) {}
    const r = localStorage.getItem("reasons"); if(r) try { shopReasons = JSON.parse(r); } catch(e) {}
    updateSnapshot(); renderGrid();
  }
  function loadConfig() { const s = localStorage.getItem("sync_cfg"); if(s) try { config = JSON.parse(s); document.getElementById("apiKeyInput").value = config.apiKey || ""; document.getElementById("binIdInput").value = config.binId || ""; } catch(e) {} }
  function saveConfig() { config.apiKey = document.getElementById("apiKeyInput").value.trim(); config.binId = document.getElementById("binIdInput").value.trim(); localStorage.setItem("sync_cfg", JSON.stringify(config)); document.getElementById("syncStatus").innerHTML = "✅ конфіг збережено"; }

  async function download() {
    if (!config.apiKey || !config.binId) { document.getElementById("syncStatus").innerHTML = "⚠️ збережіть ключі"; return; }
    if (hasLocalChanges() && !confirm("⚠️ локальні зміни будуть втрачені. продовжити?")) return;
    document.getElementById("syncStatus").innerHTML = "📡 завантаження...";
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${config.binId}/latest`, { headers: { "X-Master-Key": config.apiKey } });
      if (res.ok) {
        const data = await res.json();
        if (data.record && data.record.shops) { shops = data.record.shops; shopReasons = data.record.reasons || {}; saveLocal(); updateSnapshot(); renderGrid(); document.getElementById("syncStatus").innerHTML = "✅ синхронізовано"; }
        else document.getElementById("syncStatus").innerHTML = "⚠️ хмара порожня";
      } else document.getElementById("syncStatus").innerHTML = "❌ помилка";
    } catch(e) { document.getElementById("syncStatus").innerHTML = "❌ offline"; }
  }

  async function upload(force = false) {
    if (!config.apiKey || !config.binId) { document.getElementById("syncStatus").innerHTML = "⚠️ збережіть ключі"; return; }
    const del = getDeleted();
    if (!force && del.length) { if(confirm(`⚠️ видалення: ${del.join(", ")}. відправити?`)) upload(true); return; }
    document.getElementById("syncStatus").innerHTML = "📡 відправка...";
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${config.binId}`, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": config.apiKey }, body: JSON.stringify({ shops, reasons: shopReasons }) });
      if (res.ok) { updateSnapshot(); document.getElementById("syncStatus").innerHTML = "✅ відправлено"; }
      else document.getElementById("syncStatus").innerHTML = "❌ помилка";
    } catch(e) { document.getElementById("syncStatus").innerHTML = "❌ offline"; }
  }

  function addShop(num, color, comp, reason) {
    const n = Number(num); if (isNaN(n)) return;
    for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) shops[c][cp] = shops[c][cp].filter(i => i !== n);
    shops[color][comp].push(n); shops[color][comp].sort((a,b)=>a-b);
    if (reason) shopReasons[n] = reason;
    saveLocal(); renderGrid();
    document.getElementById("syncStatus").innerHTML = "✅ збережено → відправте в хмару";
  }
  function removeShop(n, color, comp) { shops[color][comp] = shops[color][comp].filter(i => i !== n); delete shopReasons[n]; saveLocal(); renderGrid(); document.getElementById("syncStatus").innerHTML = "✅ видалено → відправте зміни"; }

  function getReasonText(key) { const found = fullReasonsList.find(r => r.key === key); return found ? found.title : ""; }

  function openModal(color, comp) {
    const list = shops[color][comp];
    const colorMap = { "білі":"⚪ БІЛІ", "сірі":"⚫ СІРІ", "чорні":"⬛ ЧОРНІ" };
    const compMap = { "легко":"🟢 Легко", "потно":"💦 Потно", "тяжко":"⛰️ Тяжко" };
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    let inside = `<div class="modal-cyber"><div class="modal-header">${colorMap[color]} / ${compMap[comp]}</div><div class="modal-list">`;
    if (list.length === 0) inside += `<div class="empty-msg">⛔ порожньо</div>`;
    else list.forEach(shop => { inside += `<div class="shop-item-cyber"><span class="shop-number">${shop}</span><span class="shop-reason">📌 ${getReasonText(shopReasons[shop]) || "—"}</span><button class="delete-shop" data-shop="${shop}" data-color="${color}" data-comp="${comp}">✖</button></div>`; });
    inside += `</div><button class="modal-close" id="closeModal">ЗАКРИТИ</button></div>`;
    overlay.innerHTML = inside;
    document.body.appendChild(overlay);
    overlay.querySelectorAll('.delete-shop').forEach(btn => { btn.onclick = () => { const s = parseInt(btn.dataset.shop); if (confirm(`видалити ${s}?`)) { removeShop(s, btn.dataset.color, btn.dataset.comp); overlay.remove(); openModal(color, comp); } }; });
    overlay.querySelector('#closeModal').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  }

  function renderGrid() {
    const grid = document.getElementById("cyberGrid");
    if (!grid) return;
    let html = "";
    const colors = ["білі","сірі","чорні"];
    const comps = ["легко","потно","тяжко"];
    const colorNames = { "білі":"⚪ БІЛІ", "сірі":"⚫ СІРІ", "чорні":"⬛ ЧОРНІ" };
    const compIcons = { "легко":"🟢", "потно":"💦", "тяжко":"⛰️" };
    for (let c of colors) {
      for (let cp of comps) {
        const cnt = shops[c][cp].length;
        html += `<div class="grid-card" data-color="${c}" data-comp="${cp}">
          <div class="grid-color">${colorNames[c]}</div>
          <div class="grid-comp">${compIcons[cp]} ${cp}</div>
          <div class="grid-count">${cnt}</div>
        </div>`;
      }
    }
    grid.innerHTML = html;
    document.querySelectorAll('.grid-card').forEach(card => { card.onclick = () => openModal(card.dataset.color, card.dataset.comp); });
  }

  function checkShop() {
    let v = document.getElementById("checkShopInput").value.trim();
    if (!v) { document.getElementById("checkResult").innerHTML = "⚠️ введіть номер"; return; }
    let num = Number(v); if (isNaN(num)) { document.getElementById("checkResult").innerHTML = "❌ помилка"; return; }
    let found = null;
    for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) if (shops[c][cp].includes(num)) found = { color: c, comp: cp };
    if (found) document.getElementById("checkResult").innerHTML = `<strong>🏪 ${num}</strong><br>📌 ${found.color}, ${found.comp}${getReasonText(shopReasons[num]) ? `, ${getReasonText(shopReasons[num])}` : ''}`;
    else document.getElementById("checkResult").innerHTML = `<strong>🏪 ${num}</strong><br>⚠️ даних немає`;
  }

  function addUI() { let num = document.getElementById("newShopNumber").value.trim(); if(!num){ alert("введіть номер"); return; } addShop(Number(num), document.getElementById("newShopColor").value, document.getElementById("newShopComplexity").value, selectedReason); document.getElementById("newShopNumber").value = ""; }
  function initReasons() { const cont = document.getElementById("reasonButtons"); if(!cont) return; cont.innerHTML = ""; fullReasonsList.forEach(r => { const btn = document.createElement("div"); btn.className = "reason-btn"; btn.textContent = r.title; btn.dataset.reason = r.key; btn.onclick = () => { document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); selectedReason = r.key; }; cont.appendChild(btn); }); }
  function initDemo() { let has = false; for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) if (shops[c][cp].length) has = true; if (!has) { addShop(708,"чорні","тяжко","другий_поверх_руками"); addShop(39,"чорні","легко","рокля_підсобка"); addShop(3039,"білі","легко","рокля_підсобка"); addShop(642,"білі","потно","розрив_перед_весь"); } }

  loadLocal(); loadConfig(); initDemo(); initReasons(); renderGrid();
  document.getElementById("saveConfigBtn").onclick = saveConfig;
  document.getElementById("syncDownBtn").onclick = download;
  document.getElementById("syncUpBtn").onclick = () => upload(false);
  document.getElementById("checkShopBtn").onclick = checkShop;
  document.getElementById("addShopBtn").onclick = addUI;
</script>
</body>
</html>
