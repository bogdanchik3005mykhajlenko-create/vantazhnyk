<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c7da0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Вантажник">
  
  <!-- Магія для PWA: manifest і service worker прямо в коді -->
  <link rel="manifest" href="data:application/manifest+json,{
    \"name\": \"Вантажник-водій\",
    \"short_name\": \"Вантажник\",
    \"start_url\": \".\",
    \"display\": \"standalone\",
    \"background_color\": \"#e2e9f0\",
    \"theme_color\": \"#2c7da0\",
    \"icons\": [{
      \"src\": \"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c7da0'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white' font-family='Arial'%3E🚛%3C/text%3E%3C/svg%3E\",
      \"sizes\": \"any\",
      \"type\": \"image/svg+xml\"
    }]
  }">
  
  <title>Вантажник-водій</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(135deg, #e2e9f0 0%, #cfdbe5 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 12px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: #1a3a44; }
    h1 small { font-size: 0.65rem; background: #2c7da0; color: white; padding: 4px 10px; border-radius: 40px; }
    .sub { color: #2c5a6e; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #aac7d6; font-size: 0.8rem; }
    .action-panel { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .check-card, .add-card { background: white; border-radius: 18px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h3 { margin-bottom: 10px; font-size: 1.1rem; }
    .check-input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .check-input-group input { flex: 2; padding: 14px; border: 2px solid #cbdae2; border-radius: 30px; font-size: 1rem; }
    button { background: #2c7da0; border: none; padding: 12px 20px; border-radius: 40px; font-weight: 600; color: white; cursor: pointer; min-height: 48px; }
    button:active { transform: scale(0.96); }
    .check-result { margin-top: 12px; padding: 12px; background: #eef3fa; border-radius: 16px; font-size: 0.9rem; border-left: 4px solid #2c7da0; }
    .select-group { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .select-group input, .select-group select { padding: 14px; border-radius: 30px; border: 1px solid #bccbd4; font-size: 1rem; background: white; width: 100%; }
    .reason-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .reason-btn { background: #e9ecef; border: 1px solid #ced4da; padding: 6px 10px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; }
    .reason-btn.selected { background: #2c7da0; color: white; }
    .groups-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
    .group-col { background: rgba(255,255,255,0.92); border-radius: 20px; overflow: hidden; }
    .group-header { padding: 14px; font-size: 1.3rem; font-weight: bold; text-align: center; }
    .white-header { background: #ced4da; color: #1e2a2e; }
    .gray-header { background: #5f6c70; color: white; }
    .black-header { background: #1f2a2e; color: white; }
    .subgroup { border-bottom: 1px solid #e2e8f0; padding: 12px; }
    .subgroup-title { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 10px; }
    .shop-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .shop-item { background: white; border-radius: 40px; padding: 6px 12px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; border-left: 4px solid; }
    .edit-select { font-size: 0.7rem; padding: 4px 6px; border-radius: 30px; }
    .delete-shop { background: #ffe0e0; border: none; color: #b91c1c; padding: 2px 8px; border-radius: 30px; cursor: pointer; }
    .empty-msg { color: #8c9aa8; font-style: italic; padding: 6px 0; }
    footer { margin-top: 20px; text-align: center; font-size: 0.65rem; color: #3a6b7c; }
    @media (min-width: 700px) { body { padding: 20px; } .action-panel { flex-direction: row; } .select-group { flex-direction: row; align-items: center; } .select-group input { flex: 2; } .select-group select { flex: 1; } }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 Вантажник-водій 🚛 <small>PWA додаток</small></h1>
  <div class="sub">🏬 Магазини з другим поверхом, підвалами, пандусами</div>
  <div class="action-panel">
    <div class="check-card">
      <h3>🔍 Перевірити магазин</h3>
      <div class="check-input-group">
        <input type="number" id="checkShopInput" placeholder="Номер, наприклад 708">
        <button id="checkShopBtn">Підказка</button>
      </div>
      <div id="checkResult" class="check-result">👆 Введіть номер</div>
    </div>
    <div class="add-card">
      <h3>➕ Додати вручну</h3>
      <div class="select-group">
        <input type="number" id="newShopNumber" placeholder="Номер магазину">
        <select id="newShopColor"><option value="білі">⚪ Білі</option><option value="сірі">⚫ Сірі</option><option value="чорні">⬛ Чорні</option></select>
        <select id="newShopComplexity"><option value="легко">🟢 Легко</option><option value="потно">💦 Потно</option><option value="тяжко">⛰️ Тяжко</option></select>
      </div>
      <div class="reason-buttons" id="reasonButtons">
        <div class="reason-btn" data-reason="рокля_до_підсобки">🛒 Рокля</div>
        <div class="reason-btn" data-reason="розрив_перед_магазином">📦 Розрив перед</div>
        <div class="reason-btn" data-reason="другий_поверх">🏢 2й поверх</div>
        <div class="reason-btn" data-reason="глибокий_підвал">⬇️ Підвал</div>
      </div>
      <button id="addShopBtn" style="width:100%; margin-top:12px;">✅ Додати магазин</button>
    </div>
  </div>
  <div class="groups-grid" id="groupsGrid"></div>
  <footer>💡 Натисніть три крапки → Встановити додаток</footer>
</div>
<script>
  let shops = { "білі": { "легко": [], "потно": [], "тяжко": [] }, "сірі": { "легко": [], "потно": [], "тяжко": [] }, "чорні": { "легко": [], "потно": [], "тяжко": [] } };
  let shopReasons = {};
  function saveData() { localStorage.setItem("shop_app_data", JSON.stringify({ shops, shopReasons })); }
  function loadData() { const s = localStorage.getItem("shop_app_data"); if (s) { try { const d = JSON.parse(s); if (d.shops) shops = d.shops; if (d.shopReasons) shopReasons = d.shopReasons; } catch(e) {} } }
  function getReasonText(k) { const r = { "рокля_до_підсобки":"рокля", "розрив_перед_магазином":"розрив перед", "другий_поверх":"2й поверх", "глибокий_підвал":"підвал" }; return r[k]||""; }
  function addShop(num, color, comp, reason) { const n = Number(num); if (isNaN(n)) return; for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) shops[c][cp] = shops[c][cp].filter(i => i.number !== n); shops[color][comp].push({ number: n, reason: reason || "" }); shops[color][comp].sort((a,b)=>a.number-b.number); if (reason) shopReasons[n] = reason; saveData(); renderGroups(); }
  function removeShop(n, c, cp) { shops[c][cp] = shops[c][cp].filter(i => i.number !== n); delete shopReasons[n]; saveData(); renderGroups(); }
  function renderGroups() { let html = ""; const groups = ["білі","сірі","чорні"], titles = { "білі":"⚪ БІЛІ","сірі":"⚫ СІРІ","чорні":"⬛ ЧОРНІ" }, headerBg = { "білі":"white-header","сірі":"gray-header","чорні":"black-header" }, comps = ["легко","потно","тяжко"], icons = { "легко":"🟢","потно":"💦","тяжко":"⛰️" }, names = { "легко":"Легко","потно":"Потно","тяжко":"Тяжко" }; for (let g of groups) { html += `<div class="group-col"><div class="group-header ${headerBg[g]}">${titles[g]}</div>`; for (let cp of comps) { let items = shops[g][cp] || []; html += `<div class="subgroup"><div class="subgroup-title"><span>${icons[cp]} ${names[cp]}</span><span>${items.length} од.</span></div><div class="shop-list">`; if (items.length === 0) html += `<div class="empty-msg">✖️ немає</div>`; else for (let item of items) { let reasonText = getReasonText(item.reason); html += `<div class="shop-item" style="border-left-color:${cp==="легко"?"#48a848":(cp==="потно"?"#e98a2e":"#bc3f31")}"><span>${item.number}</span>${reasonText?`<span style="font-size:0.65rem;">📌 ${reasonText}</span>`:''}<select class="edit-select" data-shop="${item.number}" data-old-color="${g}" data-old-comp="${cp}"><option value="" disabled>🔄</option><option value="білі_легко">⚪ легко</option><option value="білі_потно">⚪ потно</option><option value="білі_тяжко">⚪ тяжко</option><option value="сірі_легко">⚫ легко</option><option value="сірі_потно">⚫ потно</option><option value="сірі_тяжко">⚫ тяжко</option><option value="чорні_легко">⬛ легко</option><option value="чорні_потно">⬛ потно</option><option value="чорні_тяжко">⬛ тяжко</option></select><button class="delete-shop" data-shop="${item.number}" data-color="${g}" data-comp="${cp}">✖</button></div>`; } html += `</div></div>`; } html += `</div>`; } document.getElementById("groupsGrid").innerHTML = html; attachEvents(); }
  function attachEvents() { document.querySelectorAll('.delete-shop').forEach(btn => { btn.onclick = () => { if (confirm(`Видалити?`)) removeShop(parseInt(btn.getAttribute('data-shop')), btn.getAttribute('data-color'), btn.getAttribute('data-comp')); }; }); document.querySelectorAll('.edit-select').forEach(sel => { sel.onchange = () => { let shop = parseInt(sel.getAttribute('data-shop')), oldColor = sel.getAttribute('data-old-color'), oldComp = sel.getAttribute('data-old-comp'), val = sel.value; if (!val) return; let [newColor, newComp] = val.split('_'); if (newColor === oldColor && newComp === oldComp) { sel.value = ""; return; } let oldReason = ""; let oldItem = shops[oldColor][oldComp].find(i => i.number === shop); if (oldItem) oldReason = oldItem.reason; shops[oldColor][oldComp] = shops[oldColor][oldComp].filter(i => i.number !== shop); shops[newColor][newComp].push({ number: shop, reason: oldReason }); shops[newColor][newComp].sort((a,b)=>a.number-b.number); saveData(); renderGroups(); }; }); }
  function checkShop() { let v = document.getElementById("checkShopInput").value.trim(); if (!v) { document.getElementById("checkResult").innerHTML = "⚠️ Введіть номер"; return; } let num = Number(v); if (isNaN(num)) { document.getElementById("checkResult").innerHTML = "❌ Помилка"; return; } let found = null; for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) for (let i of shops[c][cp]) if (i.number === num) found = { color: c, comp: cp, reason: i.reason }; if (found) { let colorTxt = found.color === "білі"?"⚪ Білий":(found.color==="сірі"?"⚫ Сірий":"⬛ Чорний"); let compTxt = found.comp === "легко"?"🟢 Легко":(found.comp==="потно"?"💦 Потно":"⛰️ Тяжко"); let reasonTxt = getReasonText(found.reason); document.getElementById("checkResult").innerHTML = `<strong>🏪 Магазин ${num}</strong><br>📌 ${colorTxt}, ${compTxt}${reasonTxt?`, ${reasonTxt}`:''}<br>✅ Змінити можна через випадаючий список`; } else { document.getElementById("checkResult").innerHTML = `<strong>🏪 Магазин ${num}</strong><br>⚠️ Немає даних<br>➕ Додайте вручну вище`; } }
  let selectedReason = ""; function initReasonButtons() { document.querySelectorAll('.reason-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); selectedReason = btn.getAttribute('data-reason'); }; }); }
  function addFromMobile() { let num = document.getElementById("newShopNumber").value.trim(); if (!num) { alert("Введіть номер"); return; } let color = document.getElementById("newShopColor").value; let comp = document.getElementById("newShopComplexity").value; addShop(Number(num), color, comp, selectedReason); document.getElementById("newShopNumber").value = ""; }
  function initDemo() { let has = false; for (let c of ["білі","сірі","чорні"]) for (let cp of ["легко","потно","тяжко"]) if (shops[c][cp].length) has = true; if (!has) { addShop(708,"чорні","тяжко","другий_поверх"); addShop(39,"чорні","легко","рокля_до_підсобки"); addShop(3039,"білі","легко","рокля_до_підсобки"); } }
  loadData(); initDemo(); renderGroups(); initReasonButtons(); document.getElementById("checkShopBtn").onclick = checkShop; document.getElementById("addShopBtn").onclick = addFromMobile; document.getElementById("checkShopInput").addEventListener("keypress", e => { if(e.key === "Enter") checkShop(); }); document.getElementById("newShopNumber").addEventListener("keypress", e => { if(e.key === "Enter") addFromMobile(); });
</script>
</body>
</html>
